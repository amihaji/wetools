<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup User - WE Tools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body {
    background-color: #f8f9fa;
}
.title-box {
    background-color: #003366;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.title-box i {
    margin-right: 10px;
}
.button-box {
    background: white;
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    padding: 10px;
    margin: 15px 0;
}
.btn-group-vertical-responsive {
    display: flex;
    flex-direction: row;
    gap: 10px;
}
@media (max-width: 576px) {
    .btn-group-vertical-responsive {
        flex-direction: column;
    }
}
.table-box {
    background: white;
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    padding: 10px;
}
.table-wrapper {
    max-height: 450px;
    overflow-y: auto;
}
.table-hover tbody tr:hover {
    background-color: #f2f2f2;
    cursor: pointer;
}
.actions-col {
    width: 80px;
    text-align: center;
}
.action-icon {
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
    margin: 0 5px;
    cursor: pointer;
    color: #6c757d;
}
tr:hover .action-icon {
    opacity: 1;
}
.action-icon:hover {
    color: red;
}
thead.bg-dark-blue {
    background-color: #003366;
    color: white;
}

.sticky-header th {
    position: sticky;
    top: 0;
    background-color: #003366; /* biru tua */
    color: white;
    z-index: 2;
}

@media (max-width: 576px) {
    .btn-group-vertical-responsive button,
    .btn-group-vertical-responsive a {
        width: 100% !important;
    }
}

</style>
</head>
<body class="p-2 p-sm-3">

<div class="container">

    <!-- Header Box -->
    <div class="title-box mb-3">
        <i class="fas fa-user-cog fa-lg"></i>
        <h6 class="mb-0">Setup User</h6>
    </div>

    <!-- Button Box -->
    <div class="button-box d-flex justify-content-between align-items-center btn-group-vertical-responsive">
        <button class="btn btn-primary btn-sm" id="addUserButton"><i class="fas fa-plus"></i> Add User</button>
        <a href="DashWE.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Close</a>
    </div>

    <!-- Table Box -->
    <div class="table-box">
        <div class="table-wrapper">
            <table class="table table-hover table-striped table-bordered align-middle text-center">
                <thead class="sticky-header">  
                    <tr>
                        <th>User ID</th>
                        <th>Nama User</th>
                        <th>Password</th>
                        <th>Level</th>
                        <th>Salah</th>
                        <th class="actions-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="userForm" class="modal-content">
      <div class="modal-header" style="background-color:#003366; color:white;">
        <h6 class="modal-title">Tambah User</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="mode" value="add">
          <div class="mb-2">
              <label class="form-label">User ID</label>
              <input type="text" id="userId" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Nama User</label>
              <input type="text" id="userName" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Password</label>
              <input type="text" id="userPass" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Level</label>
              <select id="userLevel" class="form-select" required>
                  <option value="Admin">Admin</option>
                  <option value="Member">Member</option>
                  <option value="User">User</option>
              </select>
          </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
      </div>
    </form>
  </div>
</div>

<script>
//***********  Deklarasi variabel global ****************
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwD8gBTa5AVUCcz9B4uZspJ0USopnrQQ-Un9p1RBSCg--A8HH-ML6ArZCaGEIRxUsbA/exec';
// ******************************************************

document.addEventListener('DOMContentLoaded', loadUserTable);
document.getElementById('addUserButton').addEventListener('click', () => {
    document.getElementById('userForm').reset();
    document.getElementById('mode').value = 'add';
    document.getElementById('userId').readOnly = false;
    document.querySelector('#userModal .modal-title').innerText = 'Tambah User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
});

document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const mode = document.getElementById('mode').value;
    const userId = document.getElementById('userId').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const userPass = document.getElementById('userPass').value.trim();
    const userLevel = document.getElementById('userLevel').value;

    const payload = mode === 'add'
        ? { action: 'addUser', userId, userName, userPass, userLevel, userSalah: 0 }
        : { action: 'editUser', userId, userName, userPass, userLevel, userSalah: 0 };

    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUserTable();
        } else {
            alert('Gagal menyimpan data: ' + (data.message || 'Unknown error'));
        }
    })
    .catch(err => {
        alert('Gagal terhubung ke server: ' + err.message);
    });
});

function loadUserTable() {
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=getTabelUser&callback=${callbackName}`;
    window[callbackName] = function(data) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Tidak ada data user.</td></tr>';
        } else {
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                    <td>${row[4]}</td>
                    <td>
                        <i class="fas fa-edit action-icon" title="Edit" onclick="editUser('${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}')"></i>
                        <i class="fas fa-trash action-icon" title="Hapus" onclick="deleteUser('${row[0]}')"></i>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

function editUser(userId, userName, userPass, userLevel, userSalah) {
    document.getElementById('mode').value = 'edit';
    document.getElementById('userId').value = userId;
    document.getElementById('userId').readOnly = true;
    document.getElementById('userName').value = userName;
    document.getElementById('userPass').value = userPass;
    document.getElementById('userLevel').value = userLevel;
    document.querySelector('#userModal .modal-title').innerText = 'Edit User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
}

function deleteUser(userId) {
    if (!confirm(`Hapus user ${userId}?`)) return;
    const payload = { action: 'deleteUser', userId };
    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            loadUserTable();
        } else {
            alert('Gagal menghapus data: ' + (data.message || 'Unknown error'));
        }
    })
    .catch(err => {
        alert('Gagal terhubung ke server: ' + err.message);
    });
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
