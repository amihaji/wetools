<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Setup User</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
.action-icon { cursor: pointer; margin: 0 5px; color: #007bff; }
.action-icon:hover { color: #0056b3; }
</style>
</head>
<body class="p-3">
<div class="container">
    <h4 class="mb-3">Setup User</h4>
    <div class="mb-2">
        <button id="addUserBtn" class="btn btn-success btn-sm">Add User</button>
        <button id="closeBtn" class="btn btn-secondary btn-sm">Close</button>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-sm" id="userTable">
            <thead class="table-light">
                <tr>
                    <th>User ID</th>
                    <th>Nama User</th>
                    <th>Password</th>
                    <th>Level</th>
                    <th>Salah</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add User</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <div class="mb-2">
                        <label>User ID</label>
                        <input type="text" id="userId" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Nama User</label>
                        <input type="text" id="userName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Password</label>
                        <input type="text" id="userPass" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Level</label>
                        <select id="userLevel" class="form-select">
                            <option>Admin</option>
                            <option>User</option>
                            <option>Member</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label>Salah</label>
                        <input type="number" id="userSalah" class="form-control" value="0" min="0" max="3">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="saveUserBtn" class="btn btn-primary btn-sm">Save</button>
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
const userModal = new bootstrap.Modal(document.getElementById('userModal'));
const userForm  = document.getElementById('userForm');
let editingId   = null;

const userLevel = sessionStorage.getItem('userLevel');
if (userLevel !== 'Admin') {
    alert("Anda tidak memiliki akses ke halaman ini.");
    window.location.href = 'DashWE.html';
}

document.getElementById('addUserBtn').addEventListener('click', () => {
    document.querySelector('.modal-title').textContent = "Add User";
    userForm.reset();
    editingId = null;
    userModal.show();
});

document.getElementById('closeBtn').addEventListener('click', () => {
    window.location.href = "DashWE.html";
});

document.getElementById('saveUserBtn').addEventListener('click', () => {
    const userData = {
        userId: document.getElementById('userId').value.trim(),
        userName: document.getElementById('userName').value.trim(),
        userPass: document.getElementById('userPass').value.trim(),
        userLevel: document.getElementById('userLevel').value,
        userSalah: document.getElementById('userSalah').value.trim()
    };

    if (!userData.userId || !userData.userName || !userData.userPass) {
        alert("Lengkapi semua field!");
        return;
    }

    if (editingId) {
        google.script.run.withSuccessHandler(loadUserTable).editUser(userData);
    } else {
        google.script.run.withSuccessHandler(loadUserTable).addUser(userData);
    }
    userModal.hide();
});

function loadUserTable() {
    google.script.run.withSuccessHandler(data => {
        const tbody = document.querySelector('#userTable tbody');
        tbody.innerHTML = "";
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[2]}</td>
                <td>${row[3]}</td>
                <td>${row[4]}</td>
                <td>
                    <span class="action-icon" onclick="editUser('${row[0]}')">✏️</span>
                    <span class="action-icon" onclick="deleteUser('${row[0]}')">🗑️</span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }).getTabelUser();
}

function editUser(userId) {
    google.script.run.withSuccessHandler(data => {
        const user = data.find(u => u[0] === userId);
        if (!user) return;
        document.querySelector('.modal-title').textContent = "Edit User";
        document.getElementById('userId').value = user[0];
        document.getElementById('userName').value = user[1];
        document.getElementById('userPass').value = user[2];
        document.getElementById('userLevel').value = user[3];
        document.getElementById('userSalah').value = user[4];
        editingId = user[0];
        userModal.show();
    }).getTabelUser();
}

function deleteUser(userId) {
    if (!confirm(`Yakin ingin menghapus user ${userId}?`)) return;
    google.script.run.withSuccessHandler(loadUserTable).deleteUser({ userId });
}

loadUserTable();
</script>
</body>
</html>
