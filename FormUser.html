<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="card login-card shadow">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="images/logo-beratidealku.png" alt="Logo" width="200">
                <h3 class="mt-3">User Login</h3>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="userId" class="form-label">User ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="userId" name="userId" required minlength="4" maxlength="6">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" maxlength="10">
                    </div>
                </div>
                <div id="message" class="mb-3"></div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="loginButton">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        Login
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="index.html">← Kembali ke Survey</a>
            </div>
        </div>
    </div>

<script>
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxG2vnzIEnTQSlgEDCJZQTbCukJZtZI23Gp8hXM5eZtInTFYD_LP7ZNG0K1A9_V7Dph/exec'; // Ganti dengan URL deployment Anda

    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const spinner = loginButton.querySelector('.spinner-border');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;

        // Tampilkan spinner dan nonaktifkan tombol
        spinner.style.display = 'inline-block';
        loginButton.disabled = true;
        messageDiv.innerHTML = '';

        const payload = {
            action: 'loginUser',
            userId: userId,
            password: password
        };

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors', // Fire and forget, tapi kita perlu redirect
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify(payload)
        })
        .then(() => {
            // Karena no-cors, kita tidak bisa baca respons.
            // Jadi, kita buat request kedua dengan JSONP untuk GET status login
            checkLoginStatus(userId);
        })
        .catch(err => {
            console.error('Fetch Error:', err);
            showMessage('Gagal terhubung ke server.', 'danger');
            resetButton();
        });
    });

    function checkLoginStatus(userId) {
        const callbackName = 'login_status_cb_' + Date.now();
        const script = document.createElement('script');
        script.src = `${URL_APPS_SCRIPT}?action=checkLogin&userId=${userId}&callback=${callbackName}`;

        script.onerror = () => {
            showMessage('Gagal memverifikasi status login.', 'danger');
            resetButton();
            delete window[callbackName];
        };

        window[callbackName] = (response) => {
            if (response.status === 'success' && response.loggedIn) {
                // Simpan token sesi di sessionStorage
                sessionStorage.setItem('userToken', response.token);
                sessionStorage.setItem('userLevel', response.level);
                sessionStorage.setItem('userId', response.userId);
                
                // Redirect ke dashboard
                window.location.href = 'DashWE.html';
            } else {
                showMessage(response.message || 'User ID atau Password salah.', 'danger');
                resetButton();
            }
            delete window[callbackName];
            document.body.removeChild(script);
        };
        document.body.appendChild(script);
    }

    function showMessage(msg, type) {
        messageDiv.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function resetButton() {
        spinner.style.display = 'none';
        loginButton.disabled = false;
    }
</script>
</body>
</html>
