<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup User - WE Tools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body { background-color: #f8f9fa; }
.table-hover tbody tr:hover { background-color: #f2f2f2; cursor: pointer; }
.actions-col { width: 120px; text-align: center; }
.action-icon { opacity: 0; transition: opacity 0.2s, color 0.2s; margin: 0 5px; cursor: pointer; color: #6c757d; }
tr:hover .action-icon { opacity: 1; }
.action-icon:hover { color: red; }
.sticky-header th { position: sticky; top: 0; background-color: #003366; color: white; z-index: 2; }
.title-box { background-color: #003366; color: white; padding: 10px 15px; border-radius: 5px; display: flex; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
.title-box i { margin-right: 10px; }
.button-box { background: white; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); padding: 10px; margin: 15px 0; }
.btn-group-vertical-responsive { display: flex; flex-direction: row; gap: 10px; }
@media (max-width: 576px) {
    .btn-group-vertical-responsive { flex-direction: column; }
    .btn-group-vertical-responsive button, .btn-group-vertical-responsive a { width: 100% !important; }
}
.table-box { background: white; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); padding: 10px; }
.table-wrapper { max-height: 450px; overflow-y: auto; }
</style>
</head>

<body class="p-2 p-sm-3">

<div class="container">

    <!-- Header Box -->
    <div class="title-box mb-3">
        <i class="fas fa-user-cog fa-lg"></i>
        <h6 class="mb-0">Setup User</h6>
    </div>

    <!-- Button Box -->
    <div class="button-box d-flex justify-content-between align-items-center btn-group-vertical-responsive">
        <button class="btn btn-primary btn-sm" id="addUserButton"><i class="fas fa-plus"></i> Add User</button>
        <a href="DashWE.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Close</a>
    </div>

    <!-- Table Box -->
    <div class="table-box">
        <div class="table-wrapper">
            <table class="table table-hover table-striped table-bordered align-middle text-center">
                <thead class="sticky-header">
                    <tr>
                        <th>User ID</th>
                        <th>Nama User</th>
                        <th>Email</th>
                        <th>HP</th>
                        <th>Password</th>
                        <th>Level</th>
                        <th>Salah</th>
                        <th class="actions-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="8">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="userForm" class="modal-content">
      <div class="modal-header" style="background-color:#003366; color:white;">
        <h6 class="modal-title">Tambah User</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="mode" value="add">
          <div class="mb-2">
              <label class="form-label">User ID</label>
              <input type="text" id="userId" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Nama User</label>
              <input type="text" id="userName" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Email User</label>
              <input type="email" id="userEmail" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">HP User</label>
              <input type="text" id="userHP" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Password</label>
              <input type="text" id="userPass" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Level</label>
              <select id="userLevel" class="form-select" required>
                  <option value="Admin">Admin</option>
                  <option value="Member">Member</option>
                  <option value="User">User</option>
              </select>
          </div>
          <div class="mb-2">
              <label class="form-label">Salah</label>
              <input type="number" id="userSalah" class="form-control" min="0" max="3" value="0" required>
          </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
      </div>
    </form>
  </div>
</div>

<script>
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwE3Fy53zJEh5GJI3u07HtUxrOwVpv3JZlZisA6NS0jKx3SFdBLcNz4xdUNGYsnbnfB/exec';

// LOAD TABLE DATA
function loadUserTable() {
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=getTabelUser&callback=${callbackName}`;
    window[callbackName] = function(data) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">Tidak ada data user.</td></tr>';
        } else {
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                    <td>${row[4]}</td>
                    <td>${row[5]}</td>
                    <td>${row[6]}</td>
                    <td>
                        <i class="fas fa-edit action-icon" title="Edit" onclick="editUser('${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}','${row[5]}','${row[6]}')"></i>
                        <i class="fas fa-trash action-icon" title="Hapus" onclick="deleteUser('${row[0]}')"></i>
                        <i class="fas fa-unlock action-icon" title="Unlock User" onclick="unlockUser('${row[0]}')"></i>
                        <i class="fas fa-paper-plane action-icon" title="Kirim Notifikasi" onclick="sendNotif('${row[0]}','${row[2]}','${row[3]}','${row[4]}')"></i>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

// ADD / EDIT USER
document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const mode = document.getElementById('mode').value;
    const userId = document.getElementById('userId').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const userEmail = document.getElementById('userEmail').value.trim();
    const userHP = document.getElementById('userHP').value.trim();
    const userPass = document.getElementById('userPass').value.trim();
    const userLevel = document.getElementById('userLevel').value;
    const userSalah = document.getElementById('userSalah').value || 0;

    const action = mode === 'add' ? 'addUser' : 'editUser';
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=${action}&userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}&userEmail=${encodeURIComponent(userEmail)}&userHP=${encodeURIComponent(userHP)}&userPass=${encodeURIComponent(userPass)}&userLevel=${encodeURIComponent(userLevel)}&userSalah=${encodeURIComponent(userSalah)}&callback=${callbackName}`;

    window[callbackName] = function(response) {
        if (response.status === 'success') {
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUserTable();
        } else {
            alert('Gagal menyimpan data: ' + (response.message || 'Unknown error'));
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
});

// DELETE USER
function deleteUser(userId) {
    if (!confirm(`Hapus user ${userId}?`)) return;
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=deleteUser&userId=${encodeURIComponent(userId)}&callback=${callbackName}`;
    window[callbackName] = function(response) {
        if (response.status === 'success') {
            loadUserTable();
        } else {
            alert('Gagal menghapus data: ' + (response.message || 'Unknown error'));
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

// UNLOCK USER
function unlockUser(userId) {
    if (!confirm(`Reset login gagal untuk user ${userId} ke 0?`)) return;
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=editUser&userId=${encodeURIComponent(userId)}&userSalah=0&callback=${callbackName}`;
    window[callbackName] = function(response) {
        if (response.status === 'success') {
            loadUserTable();
            alert(`User ${userId} berhasil di-unlock.`);
        } else {
            alert('Gagal unlock user: ' + (response.message || 'Unknown error'));
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

// SEND NOTIF
function sendNotif(userId, userEmail, userHP, userPass) {
    alert(`Konfirmasi reset telah dikirim ke:\nWA: ${userHP}\nEmail: ${userEmail}\nDengan Pass: ${userPass}`);
    // Disini Anda bisa menambahkan JSONP ke Apps Script untuk kirim notifikasi WA/Email jika diperlukan.
}

// OPEN MODAL ADD
document.getElementById('addUserButton').addEventListener('click', () => {
    document.getElementById('userForm').reset();
    document.getElementById('mode').value = 'add';
    document.getElementById('userId').readOnly = false;
    document.querySelector('#userModal .modal-title').innerText = 'Tambah User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
});

// OPEN MODAL EDIT
function editUser(userId, userName, userEmail, userHP, userPass, userLevel, userSalah) {
    document.getElementById('mode').value = 'edit';
    document.getElementById('userId').value = userId;
    document.getElementById('userId').readOnly = true;
    document.getElementById('userName').value = userName;
    document.getElementById('userEmail').value = userEmail;
    document.getElementById('userHP').value = userHP;
    document.getElementById('userPass').value = userPass;
    document.getElementById('userLevel').value = userLevel;
    document.getElementById('userSalah').value = userSalah || 0;
    document.querySelector('#userModal .modal-title').innerText = 'Edit User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
}

// INIT
document.addEventListener('DOMContentLoaded', loadUserTable);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
