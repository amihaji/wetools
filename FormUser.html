<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login User WE Tools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
body { background-color: #f8f9fa; }
.login-card { max-width: 400px; margin: auto; margin-top: 80px; }
</style>
</head>
<body>

<div class="card login-card shadow">
    <div class="card-header text-center bg-primary text-white">
        <h5>Login WE Tools</h5>
    </div>
    <div class="card-body">
        <div id="alertContainer"></div>
        <div class="mb-3">
            <label for="userId" class="form-label">User ID</label>
            <input type="text" id="userId" class="form-control" placeholder="Masukkan User ID" autofocus required>
        </div>
        <div class="mb-3">
            <label for="userPass" class="form-label">Password</label>
            <input type="password" id="userPass" class="form-control" placeholder="Masukkan Password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Login</button>
    </div>
    <div class="card-footer text-center text-muted small">
        &copy; WE Tools
    </div>
</div>

<script>
//***********  Deklarasi variabel global ****************
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxM_HDHiIU_OJsm1mZRcd7wnIoBUVXxILufvGVZbtqEcd9gyyS69AZ8z9aEDxirSCGB/exec';
// ******************************************************

document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('userPass').addEventListener('keyup', function(event){
    if (event.key === 'Enter') handleLogin();
});

function handleLogin() {
    const userIdInput = document.getElementById('userId').value.trim();
    const userPassInput = document.getElementById('userPass').value.trim();

    if (!userIdInput || !userPassInput) {
        showMessage('User ID dan Password harus diisi.', 'warning');
        return;
    }

    // disable tombol login saat proses
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = 'Memeriksa...';

    const callbackName = 'login_cb_' + Date.now();
    const script = document.createElement('script');

    script.src = `${URL_APPS_SCRIPT}?action=checkLogin&userId=${encodeURIComponent(userIdInput)}&userPass=${encodeURIComponent(userPassInput)}&callback=${callbackName}`;

    window[callbackName] = (response) => {
        if (response.status === 'success' && response.loggedIn) {
            sessionStorage.setItem('userToken', response.token);
            sessionStorage.setItem('userLevel', response.level);
            sessionStorage.setItem('userId', response.userId);

            // redirect sesuai level
            if (response.level === 'Admin') {
                window.location.href = 'DashWE.html';
            } else if (response.level === 'Member') {
                window.location.href = 'DashCRM.html';
            } else if (response.level === 'User') {
                window.location.href = 'DashUser.html';
            } else {
                showMessage('Level user tidak dikenali.', 'danger');
                resetButton();
            }
        } else {
            showMessage(response.message || 'User ID atau Password salah.', 'danger');
            resetButton();
        }
        cleanup(script, callbackName);
    };

    script.onerror = () => {
        showMessage('Gagal menghubungi server. Periksa koneksi Anda.', 'danger');
        resetButton();
        cleanup(script, callbackName);
    };

    document.body.appendChild(script);
}

function resetButton() {
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Login';
}

function cleanup(script, callbackName) {
    delete window[callbackName];
    script.remove();
}

function showMessage(message, type) {
    const alertContainer = document.getElementById('alertContainer');
    alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;
}
</script>

</body>
</html>
