<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup User - WE Tools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
/* Pengaturan warna Navbar */    
    .navbar-custom-blue {
    background-color: #002266; 
}

body { background-color: #f8f9fa; }
.table-hover tbody tr:hover { 
    background-color: #f2f2f2; 
    cursor: pointer; 
}

/****************************************************
* Pengaturan Untuk jumlah 5 baris dari tabel + header
****************************************************/
/* Wrapper untuk tabel agar bisa di-scroll vertikal dan horizontal */
.table-wrapper {
    max-height: 400px; /* Batasi tinggi tabel (sekitar 5-7 baris). Sesuaikan jika perlu. */
    overflow: auto;    /* Tambahkan scrollbar vertikal & horizontal jika konten melebihi batasan */
    border: 1px solid #dee2e6;
}
/* Membuat header tabel menjadi "sticky" */
.table-wrapper thead th {
    position: sticky; /* Membuat header tetap di posisinya */
    top: 0;           /* Tetap di posisi paling atas dari scroll container-nya (.table-wrapper) */
    z-index: 2;       /* Pastikan header berada di atas konten lain, beri nilai lebih tinggi */
}
/* Mengubah warna header tabel */
.table-dark-custom {
    --bs-table-bg: #002266;
    --bs-table-color: white;
    --bs-table-border-color: #003388;
}

/******************************************
/* Pengaturan Untuk Ikon di Edit dan Hapus
/*****************************************

/* Mengatur kolom Aksi agar rata kanan dan memiliki lebar tetap */
.actions-col {
    text-align: center;
    width: 100px; 
    /* Mencegah ikon turun ke bawah */
    /* white-space: nowrap; */ 
}
/* Mengatur setiap ikon (elemen <a> dengan kelas .action-icon) */
.action-icon {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
            
    color: #6c757d;
    background-color: transparent;
    text-decoration: none;
    margin-left: 8px;
    vertical-align: middle;   /* ikon sejajar dengan teks di barisnya */
    visibility: hidden;
    opacity: 0;
    transition: all 0.2s ease-in-out;
}
/* Memunculkan ikon saat baris (tr) di-hover */
.table-hover > tbody > tr:hover .action-icon {
    visibility: visible;
    opacity: 1;
}
/* Efek saat ikon di-hover */
.action-icon:hover { 
    background-color: #d3d3d3;  /* Warna abu-abu (lightgray) */
    color: #dc3545;             /* Warna ikon merah */
}

/* Membuat header tetap di posisinya */
/*
.sticky-header th { 
    position: sticky; 
    top: 0; 
    background-color: #003366; 
    color: white; 
    z-index: 2; 
}
*/
.title-box { 
    background-color: #003366; 
    color: white; 
    padding: 10px 15px; 
    border-radius: 5px; 
    display: flex; 
    align-items: center; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.title-box i { margin-right: 10px; }
.button-box { 
    background: white; 
    border-radius: 5px; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    padding: 10px; margin: 15px 0;
}

.loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.7); z-index: 1060;
    display: flex; justify-content: center; align-items: center;
}
        
.btn-group-vertical-responsive { 
    display: flex; 
    flex-direction: row; 
    gap: 10px;
}

.table-box {
    background: white; 
    border-radius: 5px; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    padding: 10px; 
}

@media (max-width: 576px) {
    .btn-group-vertical-responsive { flex-direction: column; }
    .btn-group-vertical-responsive button, .btn-group-vertical-responsive a { width: 100% !important; }
}
</style>
</head>

<!-- <body class="p-2 p-sm-3"> -->
<body>
<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
</div>

<!-- Tampilan Baris Navbar Dasboard -->
<nav class="navbar navbar-dark navbar-custom-blue">    
    <div class="container-fluid">
        <a class="navbar-brand" href="#"> <i class="fas fa-user-cog fa-lg"></i> Setup User</a>
        <div>
            <span class="navbar-text me-3" id="welcomeUser"></span>
            <!--
            <button class="btn btn-outline-light" id="logoutButton">Logout</button>
            -->
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Header Box -->
     <!--
    <div class="title-box mb-3">
        <i class="fas fa-user-cog fa-lg"></i>
        <h6 class="mb-0">Setup User</h6>
    </div>
    -->
    
    <!-- Button Box -->
    <div class="button-box d-flex justify-content-between align-items-center btn-group-vertical-responsive">
        <button class="btn btn-primary" id="addUserButton"><i class="fas fa-plus"></i> Add User</button>
        <a href="DashWE.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Close</a>
    </div>

    <!-- Table Box -->
    <div class="table-box">
        <div class="table-wrapper shadow-sm">
            <table class="table table-hover table-striped table-bordered align-middle text-center">
                <thead class="table-dark-custom">
                    <tr>
                        <th>User ID</th>
                        <th>Nama User</th>
                        <th>Password</th>
                        <th>Level</th>
                        <th>Salah</th>
                        <th class="actions-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
  
</div>

<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="userForm" class="modal-content">
      <div class="modal-header" style="background-color:#003366; color:white;">
        <h6 class="modal-title">Tambah User</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="mode" value="add">
          <div class="mb-2">
              <label class="form-label">User ID</label>
              <input type="text" id="userId" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Nama User</label>
              <input type="text" id="userName" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Password</label>
              <input type="text" id="userPass" class="form-control" required>
          </div>
          <div class="mb-2">
              <label class="form-label">Level</label>
              <select id="userLevel" class="form-select" required>
                  <option value="Admin">Admin</option>
                  <option value="Member">Member</option>
                  <option value="User">User</option>
              </select>
          </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
      </div>
    </form>
  </div>
</div>

<script>
//***********  Deklarasi variabel global ****************
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzSQ18cfIRmZZLWHyYRRyCCGHyy8glz7c_rG9Ls7rVODW47odVOAkXU4a5oCtgJxkAL/exec';
// ******************************************************
const loadingOverlay       = document.getElementById('loadingOverlay');

function showLoading(show) {
    loadingOverlay.style.display = show ? 'flex' : 'none';
}

// LOAD TABLE DATA
function loadUserTable() {
    const callbackName = 'cb_' + Date.now();
    const script       = document.createElement('script');
    script.src         = `${URL_APPS_SCRIPT}?action=getTabelUser&callback=${callbackName}`;

    script.onerror = () => { alert('Gagal mengambil data.'); showLoading(false); };

    window[callbackName] = function(data) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Tidak ada data user.</td></tr>';
        } else {
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                    <td>${row[4]}</td>
                    <td>
                        <i class="fas fa-edit action-icon" title="Edit" onclick="editUser('${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}')"></i>
                        <i class="fas fa-trash action-icon" title="Hapus" onclick="deleteUser('${row[0]}')"></i>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        showLoading(false);
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

// ADD / EDIT USER
document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const mode = document.getElementById('mode').value;
    const userId = document.getElementById('userId').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const userPass = document.getElementById('userPass').value.trim();
    const userLevel = document.getElementById('userLevel').value;

    const action = mode === 'add' ? 'addUser' : 'editUser';
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=${action}&userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}&userPass=${encodeURIComponent(userPass)}&userLevel=${encodeURIComponent(userLevel)}&callback=${callbackName}`;

    window[callbackName] = function(response) {
        if (response.status === 'success') {
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUserTable();
        } else {
            alert('Gagal menyimpan data: ' + (response.message || 'Unknown error'));
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
});

// DELETE USER
function deleteUser(userId) {
    if (!confirm(`Hapus user ${userId}?`)) return;
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=deleteUser&userId=${encodeURIComponent(userId)}&callback=${callbackName}`;
    window[callbackName] = function(response) {
        if (response.status === 'success') {
            loadUserTable();
        } else {
            alert('Gagal menghapus data: ' + (response.message || 'Unknown error'));
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

// OPEN MODAL ADD
document.getElementById('addUserButton').addEventListener('click', () => {
    document.getElementById('userForm').reset();
    document.getElementById('mode').value = 'add';
    document.getElementById('userId').readOnly = false;
    document.querySelector('#userModal .modal-title').innerText = 'Tambah User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
});

// OPEN MODAL EDIT
function editUser(userId, userName, userPass, userLevel, userSalah) {
    document.getElementById('mode').value = 'edit';
    document.getElementById('userId').value = userId;
    document.getElementById('userId').readOnly = true;
    document.getElementById('userName').value = userName;
    document.getElementById('userPass').value = userPass;
    document.getElementById('userLevel').value = userLevel;
    document.querySelector('#userModal .modal-title').innerText = 'Edit User';
    new bootstrap.Modal(document.getElementById('userModal')).show();
}

// INIT
document.addEventListener('DOMContentLoaded', loadUserTable);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
