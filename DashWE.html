<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS Minimal untuk Debugging */
        body { background-color: #f8f9fa; }
        .navbar-custom-blue { background-color: #002266; }
        .table-wrapper { max-height: 400px; overflow: auto; }
        .table-wrapper thead th { position: sticky; top: 0; z-index: 1; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 1060; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body onload="initializeApp()">

    <!-- Elemen penting untuk Inisialisasi -->
    <div id="loadingOverlay" style="display: none;"><div class="spinner-border text-primary"></div></div>
    
    <nav class="navbar navbar-dark navbar-custom-blue">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Dashboard Admin</a>
            <div>
                <!-- INI ELEMEN YANG MENJADI MASALAH -->
                <span class="navbar-text me-3" id="welcomeUser"></span>
                <button class="btn btn-outline-light" id="logoutButton">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Dashboard Data</h1>
        <div class="table-wrapper shadow-sm mt-3">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Nama</th>
                        <th>Nomor HP</th>
                        <th>Sponsor</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data akan diisi di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DEKLARASI GLOBAL ---
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzW3heELj4ocQ5bcSwWCBvtT6DY-tDMN3fjrRv4zVibozu4rlOk5CMKrIgA54Rbsi-K/exec';
        const userToken = sessionStorage.getItem('userToken');
        const userId = sessionStorage.getItem('userId');

        // --- FUNGSI INISIALISASI ---
        function initializeApp() {
            // Debugging paling penting
            const welcomeUserEl = document.getElementById('welcomeUser');
            console.log("Mencari elemen 'welcomeUser' saat onload:", welcomeUserEl);

            if (welcomeUserEl) {
                welcomeUserEl.textContent = `Welcome, ${userId}`;
            } else {
                alert("FATAL ERROR: Elemen 'welcomeUser' tidak dapat ditemukan setelah halaman dimuat. Periksa file HTML di GitHub.");
                return;
            }

            // Pengecekan sesi
            if (!userToken) {
                alert('Akses ditolak. Silakan login.');
                window.location.href = 'FormUser.html';
                return;
            }

            // Muat data awal
            loadTableData();

            // Event listener
            document.getElementById('logoutButton').addEventListener('click', () => {
                sessionStorage.clear();
                window.location.href = 'index.html';
            });
        }
        
        async function loadTableData() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            const url = new URL(URL_APPS_SCRIPT);
            url.searchParams.append('action', 'getDataWE');
            url.searchParams.append('token', userToken);
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const tableBody = document.getElementById('dataTableBody');
                    tableBody.innerHTML = '';
                    result.data.forEach(row => {
                        const tr = document.createElement('tr');
                        // Tampilkan data minimal untuk debugging
                        tr.innerHTML = `<td>${row[2] || ''}</td><td>${row[3] || ''}</td><td>${row[29] || ''}</td>`;
                        tableBody.appendChild(tr);
                    });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert('Gagal memuat data: ' + error.message);
                if (error.message.includes('Sesi tidak valid')) {
                    window.location.href = 'FormUser.html';
                }
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }
    </script>
</body>
</html>
