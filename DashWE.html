<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>

        /* Pengaturan warna Navbar */    
        .navbar-custom-blue {
            background-color: #002266; 
        }

        /****************************************************
        * Pengaturan Untuk jumlah 5 baris dari tabel + header
        ****************************************************/

        /* Wrapper untuk tabel agar bisa di-scroll vertikal dan horizontal */
        .table-wrapper {
            max-height: 400px; /* Batasi tinggi tabel (sekitar 5-7 baris). Sesuaikan jika perlu. */
            overflow: auto;    /* Tambahkan scrollbar vertikal & horizontal jika konten melebihi batasan */
            border: 1px solid #dee2e6;
            /* border-radius: .375rem; */
        }
        /* Membuat header tabel menjadi "sticky" */
        .table-wrapper thead th {
            position: sticky; /* Membuat header tetap di posisinya */
            top: 0;           /* Tetap di posisi paling atas dari scroll container-nya (.table-wrapper) */
            z-index: 2;       /* Pastikan header berada di atas konten lain, beri nilai lebih tinggi */
        }
        /* Mengubah warna header tabel */
        .table-dark-custom {
            --bs-table-bg: #002266;
            --bs-table-color: white;
            --bs-table-border-color: #003388;
        }

        /************************************************
        /* Pengaturan Untuk Ikon di Hapus, Edit dan Lihat
        /************************************************

        /* Mengatur kolom Aksi agar rata kanan dan memiliki lebar tetap */
        .actions-col {
            text-align: right;
            width: 140px; 
            /* KUNCI #1: Mencegah ikon turun ke bawah */
            white-space: nowrap; 
        }

        /* Mengatur setiap ikon (elemen <a> dengan kelas .action-icon) */
        .action-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            
            color: #6c757d;
            background-color: transparent;
            text-decoration: none;
            margin-left: 8px;
            
            /* KUNCI #2: Memastikan ikon sejajar dengan teks di barisnya */
            vertical-align: middle;
            
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease-in-out;
        }

        /* Memunculkan ikon saat baris (tr) di-hover */
        .table-hover > tbody > tr:hover .action-icon {
            visibility: visible;
            opacity: 1;
        }

        /* Efek saat ikon di-hover */
        .action-icon:hover {
            /* KUNCI #3: Menggunakan warna abu-abu yang lebih terlihat */
            background-color: #d3d3d3;  /* Warna abu-abu (lightgray) yang lebih jelas */
            color: #dc3545;             /* Warna ikon merah */
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); z-index: 1060;
            display: flex; justify-content: center; align-items: center;
        }
 
        /* Mengatur tampilan Grup Tombol Mode Follow-up */
        .d-none-force {
            display: none !important;
        }

        /* Mengatur lebar kolom "Pilih Semua" agar lebih lebar */
        .select-col {
            width: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>

    <!-- Tampilan Baris Navbar Dasboard -->
    <nav class="navbar navbar-dark navbar-custom-blue">    
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-tachometer-alt me-2"></i> Dashboard Admin</a>
            <div>
                <span class="navbar-text me-3" id="welcomeUser"></span>
                <button class="btn btn-outline-light" id="logoutButton">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Toolbar -->
        <div class="card mb-4">
            
            <!-- Kotak Pesan Follow Up (Awalnya Tersembunyi) -->
            <div class="card mb-3" id="followUpMessageBox" style="display: none;">
                <div class="card-body">
                    <label for="waMessage" class="form-label">
                        <strong>Tulis Pesan Follow Up Anda:</strong>
                    </label>
                    <textarea class="form-control" id="waMessage" rows="4" placeholder="Contoh: Halo {nama}, ini pesan dari {sponsor}..."></textarea>
                    <div class="form-text">
                        Gunakan <code>{nama}</code> untuk nama customer, dan <code>{sponsor}</code> untuk nama sponsor.
                    </div>
                </div>
            </div>
            
            <div class="card-body">
                <div class="row gy-2">
                    <div class="col-lg-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="filterSponsor" placeholder="Filter berdasarkan Nama Sponsor...">
                            <button class="btn btn-outline-secondary" id="filterButton" type="button"><i class="fas fa-filter"></i> Filter</button>
                        </div>
                    </div>
                    <!-- Tombol Followup Export Close -->
                    <div class="col-lg-6">
                        <div class="d-grid d-md-flex justify-content-md-end gap-2">
                            <!-- Grup Tombol Normal (Awalnya Terlihat) -->
                            <div id="normalToolbar" class="d-grid d-md-flex gap-2">
                                <button class="btn btn-primary" id="startFollowUpButton"><i class="fab fa-whatsapp"></i> Follow Up</button>
                                <button class="btn btn-success" id="exportButton"><i class="fas fa-file-excel"></i> Export</button>
                                <a href="index.html" class="btn btn-danger"><i class="fas fa-times"></i> Close</a>
                            </div>
                            <!-- Grup Tombol Mode Follow-up (Awalnya Tersembunyi) -->
                            <div id="followUpToolbar" class="d-grid d-md-flex gap-2 d-none-force">
                                <button class="btn btn-secondary" id="cancelFollowUpButton"><i class="fas fa-times"></i> Batal</button>
                                <button class="btn btn-success" id="sendWaButton"><i class="fas fa-paper-plane"></i> Kirim WA</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-container shadow-sm bg-white">
            <div class="table-wrapper shadow-sm">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark-custom">            
                        <tr>
                            <!-- KOLOM BARU UNTUK CHECKBOX "PILIH SEMUA" -->
                            <th class="select-col" style="display: none;"><input class="form-check-input" type="checkbox" id="selectAllCheckbox" title="Pilih Semua"></th>
                            <th>Tanggal</th>
                            <th>Nama</th>
                            <th>Nomor HP</th>
                            <th>Email</th>
                            <th>Sponsor</th>
                            <th>HP Sponsor</th>
                            <th class="actions-col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                       <!-- Data akan diisi oleh JavaScript di sini -->  
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAMPILAN FORM MODALS -->
    <!-- Modal Edit -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Data</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editRowIndex">
                        <div class="mb-3"><label for="editNama" class="form-label">Nama</label><input type="text" class="form-control" id="editNama" required></div>
                        <div class="mb-3"><label for="editNomorHp" class="form-label">Nomor HP</label><input type="tel" class="form-control" id="editNomorHp" required></div>
                        <div class="mb-3"><label for="editEmail" class="form-label">Email</label><input type="email" class="form-control" id="editEmail"></div>
                        <div class="mb-3"><label for="editSponsor" class="form-label">Sponsor</label><input type="text" class="form-control" id="editSponsor" required></div>
                        <div class="mb-3"><label for="editHpSponsor" class="form-label">HP Sponsor</label><input type="tel" class="form-control" id="editHpSponsor" required></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="saveChangesButton">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal View -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalLabel">Detail Hasil Analisa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="viewModalBody">
                    <!-- Konten detail akan dimuat di sini -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    //***********  Deklarasi variabel global ****************
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxu1a2colaTos0XL3PWM1nTsHI9RatQd0uc5YqGl2--G2HVGbYvDxM2XgwjI-3Zj_8k/exec';
    const userToken       = sessionStorage.getItem('userToken');
    const userLevel       = sessionStorage.getItem('userLevel');
    const userId          = sessionStorage.getItem('userId');
    // ******************************************************

    if (!userToken || !userLevel) {
        alert('Akses ditolak. Silakan login.');
        window.location.href = 'FormUser.html';
    }

    // Variabel untuk menyimpan data dan status mode
    let allDataCache = [];
    let isFollowUpMode = false;

    // --- FUNGSI UTAMA YANG DIJALANKAN SETELAH HTML SIAP ---
    document.addEventListener('DOMContentLoaded', function() {
        
        // Inisialisasi semua elemen DOM setelah halaman siap
        const welcomeUserEl = document.getElementById('welcomeUser');
        const logoutButton = document.getElementById('logoutButton');
        const filterButton = document.getElementById('filterButton');
        const exportButton = document.getElementById('exportButton');
        const saveChangesButton = document.getElementById('saveChangesButton');
        
        // Elemen untuk fitur Follow Up
        const startFollowUpButton = document.getElementById('startFollowUpButton');
        const cancelFollowUpButton = document.getElementById('cancelFollowUpButton');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const sendWaButton = document.getElementById('sendWaButton');
        
        // Inisialisasi halaman
        welcomeUserEl.textContent = `Welcome, ${userId} (${userLevel})`;
        loadTableData();

        // --- DAFTARKAN SEMUA EVENT LISTENER ---
        logoutButton.addEventListener('click', logout);
        filterButton.addEventListener('click', () => loadTableData(true)); // Muat ulang data saat filter
        exportButton.addEventListener('click', exportToExcel);
        saveChangesButton.addEventListener('click', saveChanges);
        
        // Listener untuk fitur Follow Up
        startFollowUpButton.addEventListener('click', () => toggleFollowUpMode(true));
        cancelFollowUpButton.addEventListener('click', () => toggleFollowUpMode(false));
        sendWaButton.addEventListener('click', sendFollowUpWA);
        
        selectAllCheckbox.addEventListener('click', (e) => {
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = e.target.checked;
            });
        });
    });

    // --- FUNGSI-FUNGSI LOGIKA APLIKASI ---
    function showLoading(show) {
        document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }

    function formatTanggal(isoDate) {
        if (!isoDate) return '';
        const d = new Date(isoDate);
        return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    }
    
    // Fungsi untuk mengubah tampilan antara mode normal dan mode follow-up
    function toggleFollowUpMode(isStarting) {
        isFollowUpMode = isStarting;
        document.getElementById('normalToolbar').style.display = isStarting ? 'none' : 'flex';
        document.getElementById('followUpToolbar').style.display = isStarting ? 'flex' : 'none';
        document.getElementById('followUpMessageBox').style.display = isStarting ? 'block' : 'none';
        
        // Render ulang tabel untuk menampilkan/menyembunyikan kolom checkbox dan aksi
        renderTable(allDataCache); 
    }

    // Fungsi untuk memuat data dari server
    function loadTableData(forceRefresh = false) {
        showLoading(true);
        const filterValue = document.getElementById('filterSponsor').value;

        // Gunakan cache jika tidak memaksa refresh atau filter
        if (!forceRefresh && !filterValue && allDataCache.length > 0) {
            renderTable(allDataCache);
            showLoading(false);
            return;
        }

        const callbackName = 'data_cb_' + Date.now();
        const script = document.createElement('script');
        script.src = `${URL_APPS_SCRIPT}?action=getDataWE&token=${userToken}&filter=${encodeURIComponent(filterValue)}&callback=${callbackName}`;
        script.onerror = () => { alert('Gagal mengambil data.'); showLoading(false); };

        window[callbackName] = (response) => {
            if (response.status === 'success') {
                allDataCache = response.data || [];
                renderTable(allDataCache);
            } else {
                alert(response.message);
                if(response.message.includes('Sesi tidak valid')) logout();
            }
            showLoading(false);
            if (document.body.contains(script)) {
                document.body.removeChild(script);
            }
            delete window[callbackName];
        };
        document.body.appendChild(script);
    }

    // Fungsi untuk menggambar tabel berdasarkan data
    function renderTable(data) {
        const tableBody = document.getElementById('dataTableBody');
        const tableHeaderCheckbox = document.querySelector('.select-col');
        const tableHeaderActions = document.querySelector('.actions-col');
        
        tableBody.innerHTML = '';
        
        // Tampilkan/sembunyikan kolom header berdasarkan mode
        if(tableHeaderCheckbox) tableHeaderCheckbox.style.display = isFollowUpMode ? 'table-cell' : 'none';
        if(tableHeaderActions) tableHeaderActions.style.display = isFollowUpMode ? 'none' : 'table-cell';

        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="8" class="text-center p-4">Tidak ada data.</td></tr>`;
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            const [rowIndex, tgl, nama, hp, email, ...rest] = row;
            const sponsor = row[29] || '', hpSponsor = row[30] || '';
            
            const safeNama = String(nama).replace(/'/g, "\\'"), safeHp = String(hp).replace(/'/g, "\\'"),
                  safeEmail = String(email).replace(/'/g, "\\'"), safeSponsor = String(sponsor).replace(/'/g, "\\'"),
                  safeHpSponsor = String(hpSponsor).replace(/'/g, "\\'");

            tr.innerHTML = `
                <td class="select-col" style="display: ${isFollowUpMode ? 'table-cell' : 'none'};">
                    <input class="form-check-input row-checkbox" type="checkbox" data-hp="${safeHp}" data-nama="${safeNama}" data-sponsor="${safeSponsor}">
                </td>
                <td>${formatTanggal(tgl)}</td><td>${nama}</td><td>${hp}</td><td>${email}</td><td>${sponsor}</td><td>${hpSponsor}</td>
                <td class="actions-col" style="display: ${isFollowUpMode ? 'none' : 'table-cell'};">
                    <a href="#" class="action-icon" onclick="event.preventDefault(); viewRecord(${rowIndex});" title="Lihat"><i class="fas fa-eye"></i></a>
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); openEditModal(${rowIndex}, '${safeNama}', '${safeHp}', '${safeEmail}', '${safeSponsor}', '${safeHpSponsor}');" title="Edit"><i class="fas fa-edit"></i></a>` : ''}
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); deleteRow(${rowIndex});" title="Hapus"><i class="fas fa-trash"></i></a>` : ''}
                </td>`;
            tableBody.appendChild(tr);
        });
    }

    function sendFollowUpWA() {
        // Logika untuk langkah #4 akan ditambahkan di sini nanti
        alert("Fungsi Kirim WA akan diimplementasikan pada langkah berikutnya.");
    }
 
    function logout() {
        showLoading(true);
        const payload = JSON.stringify({ action: "logoutUser", token: userToken });
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: payload
        }).finally(() => {
            sessionStorage.clear();
            window.location.href = 'FormUser.html';
        });
    }

    function openEditModal(rowIndex, nama, hp, email, sponsor, hpSponsor) {
        document.getElementById('editRowIndex').value = rowIndex;
        document.getElementById('editNama').value = nama;
        document.getElementById('editNomorHp').value = hp;
        document.getElementById('editEmail').value = email;
        document.getElementById('editSponsor').value = sponsor;
        document.getElementById('editHpSponsor').value = hpSponsor;
        editModal.show();
    }

    function saveChanges() {
        showLoading(true);
        const payload = {
            action: 'editData',
            token: userToken,
            rowIndex: document.getElementById('editRowIndex').value,
            nama: document.getElementById('editNama').value,
            nomorHp: document.getElementById('editNomorHp').value,
            email: document.getElementById('editEmail').value,
            sponsor: document.getElementById('editSponsor').value,
            hpSponsor: document.getElementById('editHpSponsor').value,
        };
        
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload)
        }).finally(() => {
            editModal.hide();
            setTimeout(loadTableData, 500); // Beri jeda agar server sempat update
        });
    }

    function deleteRow(rowIndex) {
        if (!confirm(`Anda yakin ingin menghapus data baris ke-${rowIndex}? Aksi ini tidak bisa dibatalkan.`)) return;
        showLoading(true);
        const payload = { action: 'deleteData', token: userToken, rowIndex: rowIndex };
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload)
        }).finally(() => {
            setTimeout(loadTableData, 500);
        });
    }

    function viewRecord(rowIndex) {
        showLoading(true);
        const callbackName = 'view_cb_' + Date.now();
        const script = document.createElement('script');
        script.src = `${URL_APPS_SCRIPT}?action=getSingleRecord&token=${userToken}&rowIndex=${rowIndex}&callback=${callbackName}`;

        window[callbackName] = (response) => {
            if (response.status === 'success') {
                const data = response.data;
                const viewBody = document.getElementById('viewModalBody');

                const fungsionalHTML = (data.fungsional || []).map(item => `
                    <tr>
                        <td>${item.label || "-"}</td>
                        <td style="text-align:center;">${item.jawaban || "-"}</td>
                    </tr>`).join('');

                const evaluasiHTML = (data.evaluasi || []).map(item => `
                    <tr>
                        <td>${item.param || "-"}</td>
                        <td class="text-center">${item.hasil || "-"}</td>
                        <td class="text-center">${item.ideal || "-"}</td>
                        <td class="text-center">${item.satuan || "-"}</td>
                        <td style="white-space:pre-line">${item.penjelasan || "-"}</td>
                    </tr>`).join('');

                viewBody.innerHTML = `
                    <!-- DATA PROFILE -->
                    <h6 class="mt-4"><i class="fas fa-user me-2"></i>Data Profile</h6>
                    <table class="table table-bordered">
                        <tr><th style="background-color:#4d94ff;">Tgl Survey</th>
                            <td style="background-color:#4d94ff;"><b>${data.tanggal || "-"}</b></td>
                        </tr>
                        <tr><td>Nama</td><td>${data.nama}</td></tr>
                        <tr><td>No. HP</td><td>${data.hp}</td></tr>
                        <tr><td>Email</td><td>${data.email}</td></tr>
                        <tr><td>Umur</td><td>${data.umur} tahun</td></tr>
                        <tr><td>Jenis Kelamin</td><td>${data.jk}</td></tr>
                        <tr><td>Berat Badan</td><td>${data.berat} kg</td></tr>
                        <tr><td>Tinggi Badan</td><td>${data.tinggi} cm</td></tr>
                        <tr><td>Lingkar Perut</td><td>${data.lingkar} cm</td></tr>
                        <tr><td>Aktivitas Fisik</td><td>${data.aktivitas}</td></tr>
                    </table>

                    <!-- DATA FUNGSIONAL -->
                    <h6 class="mt-4"><i class="fas fa-list-check me-2"></i>Status Fungsional</h6>
                    <table class="table table-bordered">
                        <thead>
                            <tr><th style="background-color:#4d94ff; width:85%;">Pertanyaan</th>
                            <th style="background-color:#4d94ff; text-align:center; width:15%;">Jawaban</th></tr>
                        </thead>
                        <tbody>${fungsionalHTML}</tbody>
                    </table>

                    <!-- DATA EVALUASI -->
                    <h6 class="mt-4"><i class="fas fa-heartbeat me-2"></i>Evaluasi Parameter</h6>
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                               <th style="background-color:#4d94ff; width:25%;">Parameter</th>
                               <th style="background-color:#4d94ff; width:5%; text-align:center;">Hasil</th>
                               <th style="background-color:#4d94ff; width:15%; text-align:center;">Referensi</th>
                               <th style="background-color:#4d94ff; width:5%; text-align:center;">Satuan</th>
                               <th style="background-color:#4d94ff; width:50%;">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>${evaluasiHTML}</tbody>
                    </table>

                    <!-- DATA KESIMPULAN DAN REKOMENDASI -->
                    <h6 class="mt-4">Kesimpulan & Rekomendasi</h6>
                              
                    <table class="table table-bordered">
                    <tbody>
                        <tr><th style="background-color:#4d94ff; width:15%;">Skor</th>
                        <td style="width:85%;">Persentase kebugaran anda : <strong>${data.persen}</strong></td>
                        </tr>
                        <tr><th style="background-color:#4d94ff; width:15%;">Kesimpulan </th>
                        <td style="width:85%;">${data.kesimpulan}</td>
                        </tr>
                        <tr><th style="background-color:#4d94ff; width:15%;">Rekomendasi</th>
                        <td style="width:85%;">${data.rekomendasi}</td>
                        </tr>
                    </tbody>
                    </table>`;
 
                viewModal.show();
            } else {
                alert(response.message);
            }
            showLoading(false);
        };
        document.body.appendChild(script);
    }

    
    function toggleFollowUpMode(isStarting) {
        isFollowUpMode = isStarting;
        document.getElementById('normalToolbar').style.display = isStarting ? 'none' : 'flex';
        document.getElementById('followUpToolbar').style.display = isStarting ? 'flex' : 'none';
        document.getElementById('followUpMessageBox').style.display = isStarting ? 'block' : 'none';

        // PERUBAHAN DI SINI: Tampilkan/sembunyikan kolom checkbox dan kolom aksi
        document.querySelector('.select-col').style.display = isStarting ? 'table-cell' : 'none';
        document.querySelectorAll('.actions-col').forEach(el => el.style.display = isStarting ? 'none' : 'table-cell');

        // Render ulang tabel untuk menerapkan perubahan kolom pada setiap baris
        renderTable(allDataCache); 

        // Reset state jika membatalkan
        if (!isStarting) {
            // ... (kode reset lainnya tetap sama)
        }
    }
    
    function renderTable(data) {
        const tableBody = document.getElementById('dataTableBody');
        tableBody.innerHTML = '';
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" class="text-center p-4">Tidak ada data untuk ditampilkan.</td></tr>';
            return;
        }
        
        data.forEach(row => {
            const tr = document.createElement('tr');
            const [rowIndex, tgl, nama, hp, email, ...rest] = row;
            const sponsor = row[29] || '', hpSponsor = row[30] || '';
            
            // Data untuk event handler
            const safeNama = String(nama).replace(/'/g, "\\'"), safeHp = String(hp).replace(/'/g, "\\'"),
                safeEmail = String(email).replace(/'/g, "\\'"), safeSponsor = String(sponsor).replace(/'/g, "\\'"),
                safeHpSponsor = String(hpSponsor).replace(/'/g, "\\'");

            // Struktur HTML baru dengan logika untuk checkbox
            tr.innerHTML = `
                <!-- KOLOM CHECKBOX BARIS -->
                <td class="select-col" style="display: ${isFollowUpMode ? 'table-cell' : 'none'};">
                    <input class="form-check-input row-checkbox" type="checkbox" 
                        data-hp="${safeHp}" data-nama="${safeNama}" data-sponsor="${safeSponsor}">
                </td>
                <td>${formatTanggal(tgl)}</td><td>${nama}</td><td>${hp}</td><td>${email}</td><td>${sponsor}</td><td>${hpSponsor}</td>
                <!-- KOLOM AKSI -->
                <td class="actions-col" style="display: ${isFollowUpMode ? 'none' : 'table-cell'};">
                    <a href="#" class="action-icon" onclick="event.preventDefault(); viewRecord(${rowIndex});" title="Lihat"><i class="fas fa-eye"></i></a>
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); openEditModal(${rowIndex}, '${safeNama}', '${safeHp}', '${safeEmail}', '${safeSponsor}', '${safeHpSponsor}');" title="Edit"><i class="fas fa-edit"></i></a>` : ''}
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); deleteRow(${rowIndex});" title="Hapus"><i class="fas fa-trash"></i></a>` : ''}
                </td>`;
            tableBody.appendChild(tr);
        });
    }


    // Fungsi untuk export file ke csv excel
    function exportToExcel() {
        const table = document.querySelector(".table-container table");
        let csv = [];
        for (const row of table.rows) {
            let rowData = [];
            // Ambil semua sel kecuali sel terakhir (Aksi)
            for (let i = 0; i < row.cells.length - 1; i++) {
                rowData.push('"' + row.cells[i].innerText.replace(/"/g, '""') + '"');
            }
            csv.push(rowData.join(','));
        }
        const csvContent = "data:text/csv;charset=utf-8," + csv.join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "DataSurvey.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
 
</script>
