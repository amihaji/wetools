<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup User - WETools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
.table-wrapper {
    max-height: 400px;
    overflow: auto;
    border: 1px solid #dee2e6;
}
.table-hover > tbody > tr:hover {
    background-color: #f2f2f2;
}
.actions-col {
    text-align: right;
    width: 100px;
    white-space: nowrap;
}
.action-icon {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: #6c757d;
    background-color: transparent;
    text-decoration: none;
    margin-left: 6px;
    visibility: hidden;
    opacity: 0;
    transition: all 0.2s ease-in-out;
}
.table-hover > tbody > tr:hover .action-icon {
    visibility: visible;
    opacity: 1;
}
.action-icon:hover {
    background-color: #d3d3d3;
    color: #dc3545;
}
</style>
</head>
<body class="p-4">

<div class="container">
    <h4 class="mb-3">Setup User</h4>
    <div class="d-flex justify-content-between mb-2">
        <button class="btn btn-primary" id="addUserBtn"><i class="fas fa-plus"></i> Add User</button>
        <a href="DashWE.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Close</a>
    </div>
    <div class="table-wrapper">
        <table class="table table-hover table-striped mb-0">
            <thead class="table-dark">
                <tr>
                    <th>User ID</th>
                    <th>Nama User</th>
                    <th>Password</th>
                    <th>Level</th>
                    <th>Salah</th>
                    <th class="actions-col">Aksi</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data akan terisi di sini -->
            </tbody>
        </table>
    </div>
</div>

<script>
// Variabel global
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyNvBxRtLhTf4QbqY7dY-vdLS6Pe0lB_pOYFDZ8Dh03juE2vcnJ1Bnn5F8hRHPkva8N/exec';

document.addEventListener('DOMContentLoaded', loadUserTable);
document.getElementById('addUserBtn').addEventListener('click', addUser);

function loadUserTable() {
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=getTabelUser&callback=${callbackName}`;

    window[callbackName] = (data) => {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[2]}</td>
                <td>${row[3]}</td>
                <td>${row[4]}</td>
                <td class="actions-col">
                    <a href="#" class="action-icon" title="Edit" onclick="editUser('${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}')">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="#" class="action-icon" title="Hapus" onclick="deleteUser('${row[0]}')">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

function addUser() {
    const userId = prompt('Masukkan User ID:');
    if (!userId) return;
    const userName = prompt('Masukkan Nama User:');
    const userPass = prompt('Masukkan Password:');
    const userLevel = prompt('Masukkan Level (Admin/Member/User):');
    const userSalah = 0;

    const payload = {
        action: 'addUser',
        userId,
        userName,
        userPass,
        userLevel,
        userSalah
    };

    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    }).then(() => loadUserTable());
}

function editUser(userId, userName, userPass, userLevel, userSalah) {
    const newUserName = prompt('Edit Nama User:', userName);
    if (newUserName === null) return;
    const newUserPass = prompt('Edit Password:', userPass);
    const newUserLevel = prompt('Edit Level (Admin/Member/User):', userLevel);

    const payload = {
        action: 'editUser',
        userId,
        userName: newUserName,
        userPass: newUserPass,
        userLevel: newUserLevel,
        userSalah: parseInt(userSalah)
    };

    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    }).then(() => loadUserTable());
}

function deleteUser(userId) {
    if (!confirm(`Yakin ingin menghapus user ${userId}?`)) return;

    const payload = {
        action: 'deleteUser',
        userId
    };

    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    }).then(() => loadUserTable());
}
</script>

</body>
</html>
