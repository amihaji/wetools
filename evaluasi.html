<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hasil Evaluasi</title>
</head>
<body>
  <h2>✅ TERIMA KASIH!</h2>
  <p>Hai <b><span id="nama"></span></b>, data Anda sudah berhasil disimpan.</p>
  <p>Kami akan segera menghubungi Anda via WhatsApp ke: <span id="hp"></span></p>

  <script>
    // Ambil dari localStorage
    document.getElementById("nama").innerText = localStorage.getItem("namaUser") || "User";
    document.getElementById("hp").innerText   = localStorage.getItem("noHP") || "-";
  </script>
</body>
</html>
