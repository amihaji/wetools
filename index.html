
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Survey Kebugaran - WETools Versi 2</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/styleWETools.css">
  <style>
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="form-container">
      <h2 class="text-center mb-4">Form Survey Kebugaran</h2>
      
      <!-- Progress Bar -->
      <div class="progress mb-4">
        <div id="progressBar" class="progress-bar" role="progressbar" style="width:33%">Step 1 dari 3</div>
      </div>
      
      <!-- Form Pages -->
      <form id="formDaftar">
        <!-- Page 1 -->
        <div class="page active" id="page1">
          <!-- Konten halaman 1 -->
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nama" class="form-label">Nama Lengkap</label>
              <input type="text" class="form-control" id="nama" required>
            </div>
            
            <div class="col-md-6">
              <label class="form-label">Nomor HP</label>
              <input type="tel" id="mNomorHp" class="form-control" required pattern="[0-9]{10,14}">
            </div>

            <div class="col-md-6">
              <label class="form-label">Umur</label>
              <input type="number" id="mUmur" class="form-control" required min="18" max="80">
            </div>

            <div class="col-md-6">
              <label class="form-label">Jenis Kelamin</label>
              <select id="mJenisKelamin" class="form-select" required>
                <option value="">Pilih Gender</option>
                <option value="Pria">Pria</option>
                <option value="Wanita">Wanita</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Berat Badan (kg)</label>
              <input type="number" id="mBeratBadan" class="form-control" required min="40" max="150">
            </div>

            <div class="col-md-6">
              <label class="form-label">Tinggi Badan (cm)</label>
              <input type="number" id="mTinggiBadan" class="form-control" required min="100" max="190">
            </div>

            <div class="col-md-6">
            <label class="form-label">Lingkar Perut (gunakan ukuran celana)</label>
              <select id="mLingkarPerut" class="form-select" required>
                  <option value="">Pilih Ukuran Celana</option>
                  <option value="68">26 = Lingkar 68 cm</option>
                  <option value="70">27 = Lingkar 70 cm</option>
                  <option value="72">28 = Lingkar 72 cm</option>
                  <option value="74">29 = Lingkar 74 cm</option>
                  <option value="76">30 = Lingkar 76 cm</option>
                  <option value="78">31 = Lingkar 78 cm</option>
                  <option value="80">32 = Lingkar 80 cm</option>
                  <option value="82">33 = Lingkar 82 cm</option>
                  <option value="84">34 = Lingkar 84 cm</option>
                  <option value="86">35 = Lingkar 86 cm</option>
                  <option value="88">36 = Lingkar 88 cm</option>
                  <option value="90">37 = Lingkar 90 cm</option>
                  <option value="92">38 = Lingkar 92 cm</option>
                  <option value="94">39 = Lingkar 94 cm</option>
                  <option value="96">40 = Lingkar 96 cm</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Aktivitas Fisik</label>
              <select id="mAktivitasFisik" class="form-select" required>
                <option value="">Pilih aktifitas yang dijalani</option>
                <option value="Sedikit/Tidak Olahraga">Sedentari : Sedikit/Tidak Olahraga</option>
                <option value="Olahraga ringan 1-3 hari/minggu">Ringan aktif : Olahraga ringan 1-3 hari/minggu</option>
                <option value="Olahraga moderat 3-5 hari/minggu">Moderat aktif : Olahraga moderat 3-5 hari/minggu</option>
                <option value="Olahraga berat 6-7 hari per minggu">Sangat aktif : Olahraga berat 6-7 hari per minggu</option>
                <option value="Olahraga sangat aktif + Kegiatan fisik">Ekstra aktif : Olahraga sangat aktif + Kegiatan fisik</option>
              </select>
            </div>
          </div>

             <!-- PESAN VALIDASI HALAMAN 1 -->
             <div id="formMessage1"></div>

             <!-- TOMBOL RESPONSIVE HAMALAMAN 1 -->
             <div class="d-flex justify-content-between mt-4">
               <button type="button" class="btn btn-secondary btn-custom w-100 w-md-auto mb-2 mb-md-0" onclick="resetForm()">
                 <i class="fas fa-rotate-left me-2"></i>Reset
               </button>
               
               <button type="button" class="btn btn-custom w-100 w-md-auto" onclick="validatePage1()">
                 <i class="fas fa-arrow-right me-2"></i>Berikutnya
               </button>
             </div>
        </div>
        
        <!-- Page 2 -->
        <div class="page" id="page2">
          <!-- Pertanyaan Survey -->
          <div class="question-card card p-3">
            <label class="form-label fw-bold">7. Minum air putih minimal 2 liter/hari</label>
            <div class="btn-group" role="group">
              <input type="radio" class="btn-check" name="mAir" id="mAirYa" value="Ya" required>
              <label class="btn btn-outline-primary" for="mAirYa">Ya</label>
              
              <input type="radio" class="btn-check" name="mAir" id="mAirTidak" value="Tidak">
              <label class="btn btn-outline-primary" for="mAirTidak">Tidak</label>
            </div>
          </div>
          
          <!-- Ulangi untuk pertanyaan lainnya -->
          
          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-secondary" onclick="navigate(2, 1)">Sebelumnya</button>
            <button type="button" class="btn btn-primary-custom" onclick="validatePage2()">Submit</button>
          </div>
        </div>
        
        <!-- Page 3 -->
        <div class="page" id="page3">
          <!-- Hasil Survey -->
          <div id="hasilAnalisa" class="card p-3 mb-4"></div>
          
          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset Form</button>
            <button type="button" class="btn btn-primary-custom" onclick="kirimData()">Kirim</button>
          </div>
        </div>
      </form>
      
      <!-- Footer -->
      <footer class="footer-custom p-3 mt-4 rounded">
        <div class="row">
          <div class="col-md-6 text-center text-md-start">
            <a href="https://bit.ly/BERATIDEALKU" class="text-white text-decoration-none">
              Copyright © 2025, beratidealku - All rights reserved
            </a>
          </div>
          <div class="col-md-6 text-center text-md-end">
            <a href="https://bit.ly/LokasiKlubKita" class="text-white text-decoration-none">
              <i class="fas fa-map-marker-alt me-1"></i> Lokasi Map NC - klubKITA 
            </a>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!--
<script src="js/core.min.js"></script>
<script src="js/script.js"></script>
-->
<script src="js/jsWETools.js"></script>
</body>
</html>
