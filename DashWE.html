<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom-blue { background-color: #002266; }

        /* 1. Mengatur scroll pada tabel */
        .table-wrapper {
            max-height: 350px; /* Kira-kira untuk 5 baris + header */
            overflow: auto;    /* Scroll vertikal dan horizontal */
            border: 1px solid #dee2e6;
            border-radius: .375rem;
        }
        .table-wrapper thead th {
            position: sticky; top: 0; z-index: 2;
        }
        .table-dark-custom {
            --bs-table-bg: #002266; --bs-table-color: white; --bs-table-border-color: #003388;
        }
        .table > :not(caption) > * > * { white-space: nowrap; }

        /* 2. Mengatur kolom Aksi dan Ikon */
        .select-col { width: 50px; text-align: center; }
        .actions-col { text-align: right; width: 140px; white-space: nowrap; }
        .action-icon {
            display: inline-flex; justify-content: center; align-items: center;
            width: 32px; height: 32px; border-radius: 50%;
            color: #6c757d; background-color: transparent; text-decoration: none;
            margin-left: 8px; vertical-align: middle;
            visibility: hidden; opacity: 0;
            transition: all 0.2s ease-in-out;
        }
        .table-hover > tbody > tr:hover .action-icon { visibility: visible; opacity: 1; }
        .action-icon:hover { background-color: #d3d3d3; color: #dc3545; }
        
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8); z-index: 1060;
            display: flex; justify-content: center; align-items: center;
        }

        /* 3. Mengatur Tampilan Mobile */
        @media (max-width: 768px) {
            .toolbar-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" style="display: none;"><div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div></div>

    <nav class="navbar navbar-dark navbar-custom-blue">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-tachometer-alt me-2"></i> Dashboard Admin</a>
            <div>
                <span class="navbar-text me-3" id="welcomeUser"></span>
                <button class="btn btn-outline-light" id="logoutButton">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Toolbar -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row gy-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <input type="text" class="form-control" id="filterSponsor" placeholder="Filter Nama Sponsor...">
                            <button class="btn btn-outline-secondary" id="filterButton" type="button"><i class="fas fa-filter"></i></button>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="toolbar-buttons d-grid d-md-flex justify-content-md-end gap-2">
                            <!-- Tombol akan di-switch oleh JS -->
                            <div id="normalToolbar" class="d-grid d-md-flex gap-2">
                                <button class="btn btn-primary" id="startFollowUpButton"><i class="fab fa-whatsapp"></i> Follow Up</button>
                                <button class="btn btn-success" id="exportButton"><i class="fas fa-file-excel"></i> Export</button>
                                <a href="index.html" class="btn btn-danger"><i class="fas fa-times"></i> Close</a>
                            </div>
                            <div id="followUpToolbar" class="d-grid d-md-flex gap-2" style="display: none;">
                                <button class="btn btn-secondary" id="cancelFollowUpButton"><i class="fas fa-times"></i> Batal</button>
                                <button class="btn btn-success" id="sendWaButton"><i class="fas fa-paper-plane"></i> Kirim WA</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Kotak Pesan Follow Up -->
        <div class="card mb-3" id="followUpMessageBox" style="display: none;">
            <div class="card-body">
                <label for="waMessage" class="form-label"><strong>Tulis Pesan Follow Up:</strong></label>
                <textarea class="form-control" id="waMessage" rows="4"></textarea>
                <div class="form-text">Gunakan <code>{nama}</code> dan <code>{sponsor}</code>.</div>
                <div id="sendProgress" class="mt-2" style="display: none;">
                    <div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;"></div></div>
                    <small class="text-muted" id="progressText"></small>
                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-wrapper shadow-sm">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark-custom">
                    <tr>
                        <th class="select-col" style="display: none;"><input class="form-check-input" type="checkbox" id="selectAllCheckbox"></th>
                        <th>Tanggal</th><th>Nama</th><th>Nomor HP</th><th>Email</th>
                        <th>Sponsor</th><th>HP Sponsor</th><th class="actions-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Modals -->
    <div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit Data</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="editForm"><input type="hidden" id="editRowIndex"><div class="mb-3"><label for="editNama" class="form-label">Nama</label><input type="text" class="form-control" id="editNama" required></div><div class="mb-3"><label for="editNomorHp" class="form-label">Nomor HP</label><input type="tel" class="form-control" id="editNomorHp" required></div><div class="mb-3"><label for="editEmail" class="form-label">Email</label><input type="email" class="form-control" id="editEmail"></div><div class="mb-3"><label for="editSponsor" class="form-label">Sponsor</label><input type="text" class="form-control" id="editSponsor" required></div><div class="mb-3"><label for="editHpSponsor" class="form-label">HP Sponsor</label><input type="tel" class="form-control" id="editHpSponsor" required></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button type="button" class="btn btn-primary" id="saveChangesButton">Simpan</button></div></div></div></div>
    <div class="modal fade" id="viewModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Detail Hasil Analisa</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="viewModalBody"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    //***********  Deklarasi variabel global ****************
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwGiiIv391z9_XincXgMfec8g97jswH4v5qu0s_Q77wqATKWpeE_xxsejmW4-MbdoyR/exec';
    const userToken       = sessionStorage.getItem('userToken'), userLevel = sessionStorage.getItem('userLevel'), userId = sessionStorage.getItem('userId');
    let allDataCache      = []; // Cache untuk menyimpan data tabel
    // ******************************************************

    if (!userToken || !userLevel) {
        alert('Akses ditolak. Silakan login.');
        window.location.href = 'FormUser.html';
    }

    const loadingOverlay = document.getElementById('loadingOverlay'),
          editModal = new bootstrap.Modal(document.getElementById('editModal')),
          viewModal = new bootstrap.Modal(document.getElementById('viewModal'));
          
    let isFollowUpMode = false;

    // Fungsi untuk membuat request ke server dengan penanganan error
    async function apiRequest(action, params = {}) {
        const url = new URL(URL_APPS_SCRIPT);
        url.searchParams.append('action', action);
        url.searchParams.append('token', userToken);
        for(const key in params) {
            url.searchParams.append(key, params[key]);
        }
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const result = await response.json();
            if (result.status === 'error') {
                 if (result.message.includes('Sesi tidak valid')) logout();
                 throw new Error(result.message);
            }
            return result;
        } catch (error) {
            console.error('API Request Error:', error);
            alert(`Terjadi kesalahan: ${error.message}`);
            throw error; // Lemparkan lagi agar bisa ditangkap pemanggil
        }
    }

    // Fungsi untuk POST data
    async function apiPost(payload) {
        try {
            const response = await fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                body: JSON.stringify({...payload, token: userToken}),
                headers: {'Content-Type': 'application/json'}
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return await response.json();
        } catch (error) {
            console.error('API POST Error:', error);
            alert(`Terjadi kesalahan: ${error.message}`);
            throw error;
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('welcomeUser').textContent = `Welcome, ${userId}`;
        loadTableData();
        
        document.getElementById('logoutButton').addEventListener('click', logout);
        document.getElementById('filterButton').addEventListener('click', () => loadTableData(true));
        document.getElementById('exportButton').addEventListener('click', exportToExcel);
        document.getElementById('startFollowUpButton').addEventListener('click', () => toggleFollowUpMode(true));
        document.getElementById('cancelFollowUpButton').addEventListener('click', () => toggleFollowUpMode(false));
        document.getElementById('sendWaButton').addEventListener('click', sendFollowUpWA);
        document.getElementById('saveChangesButton').addEventListener('click', saveChanges);
        document.getElementById('selectAllCheckbox').addEventListener('click', (e) => document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = e.target.checked));
    });

    function showLoading(show) { loadingOverlay.style.display = show ? 'flex' : 'none'; }
    function formatTanggal(isoDate) {
        if (!isoDate) return '';
        const d = new Date(isoDate);
        return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    }

    async function loadTableData(isFilter = false) {
        showLoading(true);
        const filterValue = document.getElementById('filterSponsor').value;
        try {
            const result = await apiRequest('getDataWE', { filter: filterValue });
            allDataCache = result.data;
            renderTable(allDataCache);
        } catch (error) {
            // Error sudah ditangani di apiRequest
        } finally {
            showLoading(false);
        }
    }

    function renderTable(data) {
        const tableBody = document.getElementById('dataTableBody');
        tableBody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            const [rowIndex, tgl, nama, hp, email, ...rest] = row;
            const sponsor = row[29], hpSponsor = row[30];
            
            const safeNama = String(nama || '').replace(/'/g, "\\'"), safeHp = String(hp || '').replace(/'/g, "\\'"),
                  safeEmail = String(email || '').replace(/'/g, "\\'"), safeSponsor = String(sponsor || '').replace(/'/g, "\\'"),
                  safeHpSponsor = String(hpSponsor || '').replace(/'/g, "\\'");

            tr.innerHTML = `
                <td class="select-col" style="display: ${isFollowUpMode ? 'table-cell' : 'none'};"><input class="form-check-input row-checkbox" type="checkbox" data-hp="${safeHp}" data-nama="${safeNama}" data-sponsor="${safeSponsor}"></td>
                <td>${formatTanggal(tgl)}</td><td>${nama}</td><td>${hp}</td><td>${email}</td><td>${sponsor}</td><td>${hpSponsor}</td>
                <td class="actions-col" style="display: ${isFollowUpMode ? 'none' : 'table-cell'};">
                    <a href="#" class="action-icon" onclick="viewRecord(${rowIndex})" title="Lihat"><i class="fas fa-eye"></i></a>
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="openEditModal(${rowIndex}, '${safeNama}', '${safeHp}', '${safeEmail}', '${safeSponsor}', '${safeHpSponsor}')" title="Edit"><i class="fas fa-edit"></i></a>` : ''}
                    ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="deleteRow(${rowIndex})" title="Hapus"><i class="fas fa-trash"></i></a>` : ''}
                </td>`;
            tableBody.appendChild(tr);
        });
    }

    function toggleFollowUpMode(isStarting) {
        isFollowUpMode = isStarting;
        document.getElementById('normalToolbar').style.display = isStarting ? 'none' : 'grid';
        document.getElementById('followUpToolbar').style.display = isStarting ? 'grid' : 'none';
        document.getElementById('followUpMessageBox').style.display = isStarting ? 'block' : 'none';
        renderTable(allDataCache); // Render ulang tabel untuk menampilkan/menyembunyikan kolom
    }
    
    async function sendFollowUpWA() {
        const messageTemplate = document.getElementById('waMessage').value;
        if (!messageTemplate) return alert('Pesan WA tidak boleh kosong.');
        const recipients = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => ({...cb.dataset}));
        if (recipients.length === 0) return alert('Pilih minimal satu penerima.');
        if (!confirm(`Anda akan mengirim pesan ke ${recipients.length} penerima. Lanjutkan?`)) return;

        const sendButton = document.getElementById('sendWaButton');
        const progress = { bar: document.querySelector('#sendProgress .progress-bar'), text: document.getElementById('progressText') };
        
        sendButton.disabled = true;
        sendButton.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Mengirim...`;
        sendProgress.style.display = 'block';

        const payload = { action: 'sendBulkWA', recipients: recipients, message: messageTemplate };
        
        progress.text.textContent = `Mengirim 1 dari ${recipients.length}...`;
        progressBar.style.width = `${(1 / recipients.length) * 100}%`;

        try {
            const result = await apiPost(payload);
            alert(result.message || 'Proses selesai.');
        } finally {
            toggleFollowUpMode(false);
        }
    }
    
    async function viewRecord(rowIndex) {
        showLoading(true);
        try {
            const result = await apiRequest('getSingleRecord', { rowIndex: rowIndex });
            const data = result.data;
            const viewBody = document.getElementById('viewModalBody');
            
            const evaluasiHTML = (data.evaluasi || []).map(item => `
                <tr><td>${item.param || "-"}</td><td class="text-center">${item.hasil || "-"}</td>
                <td class="text-center">${item.ideal || "-"}</td><td class="text-center">${item.satuan || "-"}</td>
                <td style="white-space:pre-line">${item.penjelasan || "-"}</td></tr>`).join('');
            
            viewBody.innerHTML = `<table class="table table-sm table-bordered">
                                    <tr><th width="30%">Tgl Survey</th><td>${data.tanggal}</td></tr>
                                    <tr><th>Nama</th><td>${data.nama}</td></tr>
                                    <tr><th>Skor</th><td><strong>${data.persen}</strong></td></tr>
                                    <tr><th>Kesimpulan</th><td>${data.kesimpulan}</td></tr>
                                  </table>

                                  <h6 class="mt-4">Evaluasi Parameter</h6>
                                  <table class="table table-sm table-bordered">
                                    <thead class="table-dark">
                                      <tr><th>Parameter</th><th>Hasil</th><th>Referensi</th><th>Satuan</th><th>Keterangan</th></tr>
                                    </thead>
                                    <tbody>${evaluasiHTML}</tbody>
                                  </table>`;
            viewModal.show();
        } finally {
            showLoading(false);
        }
    }

    async function saveChanges() {
        showLoading(true);
        const payload = {
            action: 'editData',
            rowIndex: document.getElementById('editRowIndex').value,
            nama: document.getElementById('editNama').value,
            nomorHp: document.getElementById('editNomorHp').value,
            email: document.getElementById('editEmail').value,
            sponsor: document.getElementById('editSponsor').value,
            hpSponsor: document.getElementById('editHpSponsor').value,
        };
        try {
            await apiPost(payload);
            editModal.hide();
            loadTableData(true); // Muat ulang data dari server
        } finally {
            showLoading(false);
        }
    }

    async function deleteRow(rowIndex) {
        if (!confirm(`Anda yakin ingin menghapus data baris ke-${rowIndex}? Aksi ini tidak bisa dibatalkan.`)) return;
        showLoading(true);
        try {
            await apiPost({ action: 'deleteData', rowIndex: rowIndex });
            loadTableData(true);
        } finally {
            showLoading(false);
        }
    }

    function exportToExcel() {
        const table = document.querySelector(".table-container table");
        let csv = [];
        for (const row of table.rows) {
            let rowData = [];
            // Ambil semua sel kecuali sel terakhir (Aksi)
            for (let i = 0; i < row.cells.length - 1; i++) {
                rowData.push('"' + row.cells[i].innerText.replace(/"/g, '""') + '"');
            }
            csv.push(rowData.join(','));
        }
        const csvContent = "data:text/csv;charset=utf-8," + csv.join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "DataSurvey.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
  
    function logout() {
        showLoading(true);
        const payload = JSON.stringify({ action: "logoutUser", token: userToken });
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: payload
        }).finally(() => {
            sessionStorage.clear();
            window.location.href = 'FormUser.html';
        });
    }

    function openEditModal(rowIndex, nama, hp, email, sponsor, hpSponsor) {
        document.getElementById('editRowIndex').value = rowIndex;
        document.getElementById('editNama').value = nama;
        document.getElementById('editNomorHp').value = hp;
        document.getElementById('editEmail').value = email;
        document.getElementById('editSponsor').value = sponsor;
        document.getElementById('editHpSponsor').value = hpSponsor;
        editModal.show();
    }

    // Format penanggalan Indonesia
    function formatTanggal(tanggalISO) {
        if (!tanggalISO) return ''; // Kembalikan string kosong jika tanggal tidak ada
        
        try {
            const d = new Date(tanggalISO);
            // getMonth() dimulai dari 0 (Januari=0), jadi kita tambah 1
            const hari = String(d.getDate()).padStart(2, '0');
            const bulan = String(d.getMonth() + 1).padStart(2, '0');
            const tahun = d.getFullYear();
            return `${hari}-${bulan}-${tahun}`;
        } catch (e) {
            // Jika format tanggal tidak valid, kembalikan apa adanya
            return tanggalISO;
        }
    }
</script>
</body>
</html>
