<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup User - WE Tools</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
.table-hover tbody tr:hover {
    background-color: #f2f2f2;
    cursor: pointer;
}
.action-icon {
    color: #6c757d;
    margin-right: 8px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
}
tr:hover .action-icon {
    opacity: 1;
}
</style>
</head>
<body class="p-3">

<div class="container">
    <h4 class="mb-3">Setup User</h4>
    <div class="d-flex justify-content-between mb-2">
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal" id="addUserButton">
            <i class="fas fa-plus"></i> Add User
        </button>
        <a href="DashWE.html" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left"></i> Close
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th>User ID</th>
                    <th>Nama User</th>
                    <th>Password</th>
                    <th>Level</th>
                    <th>Salah</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="6">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="userForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="mode" value="add">
          <div class="mb-2">
              <label>User ID</label>
              <input type="text" id="userId" class="form-control" required>
          </div>
          <div class="mb-2">
              <label>Nama User</label>
              <input type="text" id="userName" class="form-control" required>
          </div>
          <div class="mb-2">
              <label>Password</label>
              <input type="text" id="userPass" class="form-control" required>
          </div>
          <div class="mb-2">
              <label>Level</label>
              <select id="userLevel" class="form-select" required>
                  <option value="Admin">Admin</option>
                  <option value="Member">Member</option>
                  <option value="User">User</option>
              </select>
          </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
      </div>
    </form>
  </div>
</div>

<script>
//***********  Deklarasi variabel global ****************
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzuQS_9OUsnVWTlucu61OmdsNAVvZnJxtvFDTxU0u_H4S8AVM1__pqjtavB2TsNEaaf/exec';
// ******************************************************

// Load data user saat halaman dibuka
document.addEventListener('DOMContentLoaded', loadUserTable);

// Tambah User - modal reset
document.getElementById('addUserButton').addEventListener('click', () => {
    document.getElementById('modalTitle').innerText = 'Add User';
    document.getElementById('mode').value = 'add';
    document.getElementById('userForm').reset();
});

// Form submit
document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const mode = document.getElementById('mode').value;
    const userId = document.getElementById('userId').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const userPass = document.getElementById('userPass').value.trim();
    const userLevel = document.getElementById('userLevel').value;

    let payload = {};
    if (mode === 'add') {
        payload = {
            action: 'addUser',
            userId, userName, userPass, userLevel, userSalah: 0
        };
    } else {
        payload = {
            action: 'editUser',
            userId, userName, userPass, userLevel, userSalah: 0
        };
    }

    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    })
    .then(() => {
        const modal = bootstrap.Modal.getInstance(document.getElementById('userModal'));
        modal.hide();
        loadUserTable();
    });
});

function loadUserTable() {
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = `${URL_APPS_SCRIPT}?action=getTabelUser&callback=${callbackName}`;

    window[callbackName] = function(data) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Tidak ada data user.</td></tr>';
        } else {
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                    <td>${row[4]}</td>
                    <td>
                        <i class="fas fa-edit action-icon" title="Edit" onclick="editUser('${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}')"></i>
                        <i class="fas fa-trash action-icon" title="Hapus" onclick="deleteUser('${row[0]}')"></i>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.body.removeChild(script);
        delete window[callbackName];
    };
    document.body.appendChild(script);
}

function editUser(userId, userName, userPass, userLevel, userSalah) {
    document.getElementById('modalTitle').innerText = 'Edit User';
    document.getElementById('mode').value = 'edit';
    document.getElementById('userId').value = userId;
    document.getElementById('userId').readOnly = true;
    document.getElementById('userName').value = userName;
    document.getElementById('userPass').value = userPass;
    document.getElementById('userLevel').value = userLevel;
    const modal = new bootstrap.Modal(document.getElementById('userModal'));
    modal.show();
}

function deleteUser(userId) {
    if (!confirm(`Yakin ingin menghapus user ${userId}?`)) return;
    const payload = { action: 'deleteUser', userId };
    fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
    })
    .then(() => loadUserTable());
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
