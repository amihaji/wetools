<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="card login-card shadow">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="images/logo-beratidealku.png" alt="Logo" width="200">
                <h3 class="mt-3">User Login</h3>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="userId" class="form-label">User ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="userId" name="userId" required minlength="4" maxlength="6">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" maxlength="10">
                    </div>
                </div>
                <div id="message" class="mb-3"></div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="loginButton">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        Login
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="index.html">← Kembali ke Survey</a>
            </div>
        </div>
    </div>

<script>
    //***********  Deklarasi variabel global ****************
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbykVGomdJScqnuSCe3RscsExOUPRRFsdsL3-8W6ffezNxrbzKCnp7Q75iQEVBvIhmUH/exec';
    const loginForm       = document.getElementById('loginForm');
    const loginButton     = document.getElementById('loginButton');
    const spinner         = loginButton.querySelector('.spinner-border');
    const messageDiv      = document.getElementById('message');
    // ******************************************************
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        spinner.style.display = 'inline-block';
        loginButton.disabled = true;
        messageDiv.innerHTML = '';

        const payload = {
            action: 'loginUser',
            userId: document.getElementById('userId').value,
            password: document.getElementById('password').value
        };

        // Menggunakan metode POST standar, bukan lagi JSONP atau no-cors
        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json()) // Langsung baca respons sebagai JSON
        .then(result => {
            if (result.status === 'success' && result.loggedIn) {
                // Simpan data sesi yang diterima dari server
                sessionStorage.setItem('userToken', result.token);
                sessionStorage.setItem('userLevel', result.level);
                sessionStorage.setItem('userId', result.userId);
                
                // Redirect jika levelnya Admin
                if (result.level === 'Admin') {
                    window.location.href = 'DashWE.html';
                } else {
                    showMessage('Login berhasil, namun Anda tidak memiliki hak akses Admin.', 'warning');
                }
            } else {
                // Tampilkan pesan error dari server
                showMessage(result.message || 'User ID atau Password salah.', 'danger');
            }
        })
        .catch(err => {
            console.error('Fetch Error:', err);
            showMessage('Gagal terhubung ke server. Periksa koneksi internet Anda.', 'danger');
        })
        .finally(() => {
            // Selalu reset tombol setelah selesai
            spinner.style.display = 'none';
            loginButton.disabled = false;
        });
    });

    function showMessage(msg, type) {
        messageDiv.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                                  ${msg}
                                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>`;
    }

</script>
    
</body>
</html>
