<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - WETools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom-blue { background-color: #002266; }
        .table-container {
            max-height: 400px; /* Batasan tinggi untuk memicu scroll */
            overflow: auto;
            border: 1px solid #dee2e6;
            border-radius: .375rem;
        }
        .table-wrapper thead th {
            position: sticky; top: 0; z-index: 2;
        }
        .table-dark-custom {
            --bs-table-bg: #002266;
            --bs-table-color: white;
            --bs-table-border-color: #003388;
        }
        .table > :not(caption) > * > * { white-space: nowrap; }
        .actions-col { text-align: right; width: 140px; white-space: nowrap; }
        .action-icon {
            display: inline-flex; justify-content: center; align-items: center;
            width: 32px; height: 32px; border-radius: 50%;
            color: #6c757d; background-color: transparent; text-decoration: none;
            margin-left: 8px; vertical-align: middle;
            visibility: hidden; opacity: 0;
            transition: all 0.2s ease-in-out;
        }
        .table-hover > tbody > tr:hover .action-icon { visibility: visible; opacity: 1; }
        .action-icon:hover { background-color: #d3d3d3; color: #dc3545; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); z-index: 1060;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>

    <nav class="navbar navbar-dark navbar-custom-blue">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-tachometer-alt me-2"></i> Dashboard Admin</a>
            <div>
                <span class="navbar-text me-3" id="welcomeUser"></span>
                <button class="btn btn-outline-light" id="logoutButton">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Toolbar -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row gy-3 align-items-end">
                    <!-- Filter Tanggal -->
                    <div class="col-md-6 col-lg-3">
                        <label for="startDate" class="form-label fw-bold mb-1">Dari Tanggal</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label for="endDate" class="form-label fw-bold mb-1">Sampai Tanggal</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>

                    <!-- Filter Sponsor -->
                    <div class="col-lg-6">
                        <label for="filterSponsor" class="form-label fw-bold mb-1">Nama Sponsor</label>
                        <input type="text" class="form-control" id="filterSponsor" placeholder="Filter sponsor...">
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="col-12">
                        <div class="d-grid d-lg-flex justify-content-lg-end gap-2 mt-3">
                            <button class="btn btn-primary" id="filterButton" type="button"><i class="fas fa-filter"></i> Terapkan Filter</button>
                            <button class="btn btn-secondary" id="resetFilterButton" type="button"><i class="fas fa-undo"></i> Reset</button>
                            <button class="btn btn-success" id="exportButton"><i class="fas fa-file-excel"></i> Export</button>
                            <a href="index.html" class="btn btn-danger"><i class="fas fa-times"></i> Close</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-wrapper shadow-sm">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark-custom">
                    <tr>
                        <th>Tanggal</th> <th>Nama</th> <th>Nomor HP</th> <th>Email</th>
                        <th>Sponsor</th> <th>HP Sponsor</th> <th class="actions-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAMPILAN FORM MODALS -->
    <!-- Modal Edit -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Edit Data</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editRowIndex">
                        <div class="mb-3"><label for="editNama" class="form-label">Nama</label><input type="text" class="form-control" id="editNama" required></div>
                        <div class="mb-3"><label for="editNomorHp" class="form-label">Nomor HP</label><input type="tel" class="form-control" id="editNomorHp" required></div>
                        <div class="mb-3"><label for="editEmail" class="form-label">Email</label><input type="email" class="form-control" id="editEmail"></div>
                        <div class="mb-3"><label for="editSponsor" class="form-label">Sponsor</label><input type="text" class="form-control" id="editSponsor" required></div>
                        <div class="mb-3"><label for="editHpSponsor" class="form-label">HP Sponsor</label><input type="tel" class="form-control" id="editHpSponsor" required></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="saveChangesButton">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal View -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalLabel">Detail Hasil Analisa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="viewModalBody">
                    <!-- Konten detail akan dimuat di sini -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    //***********  Deklarasi variabel global ****************
   
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwo5BXZpCUtDYHhy22fxl_NumvkJZxBn2sR2G5tsuUl_Rh3GhQyYPnAY41LASM6f_po/exec'; 
    const userToken = sessionStorage.getItem('userToken');
    const userLevel = sessionStorage.getItem('userLevel');
    const userId = sessionStorage.getItem('userId');

    // Cek otentikasi saat halaman dimuat
    if (!userToken || !userLevel) {
        alert('Akses ditolak. Silakan login terlebih dahulu.');
        window.location.href = 'FormUser.html';
    }

    const loadingOverlay = document.getElementById('loadingOverlay');
    const editModal = new bootstrap.Modal(document.getElementById('editModal'));
    const viewModal = new bootstrap.Modal(document.getElementById('viewModal'));

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('welcomeUser').textContent = `Welcome, ${userId} (${userLevel})`;
        loadTableData();

        // Event Listeners
        document.getElementById('logoutButton').addEventListener('click', logout);
        document.getElementById('filterButton').addEventListener('click', loadTableData);
        document.getElementById('resetFilterButton').addEventListener('click', () => {
            document.getElementById('filterSponsor').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadTableData();
        });
        document.getElementById('saveChangesButton').addEventListener('click', saveChanges);
        document.getElementById('exportButton').addEventListener('click', exportToExcel);
    });

    function showLoading(show) {
        loadingOverlay.style.display = show ? 'flex' : 'none';
    }
    
    function formatTanggal(tanggalISO) {
        if (!tanggalISO) return '';
        try {
            const d = new Date(tanggalISO);
            const hari = String(d.getDate()).padStart(2, '0');
            const bulan = String(d.getMonth() + 1).padStart(2, '0');
            const tahun = d.getFullYear();
            return `${hari}-${bulan}-${tahun}`;
        } catch (e) {
            return tanggalISO;
        }
    }

    function loadTableData() {
        showLoading(true);
        const filterSponsor = document.getElementById('filterSponsor').value;
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        const callbackName = 'data_cb_' + Date.now();
        const script = document.createElement('script');
        
        const params = new URLSearchParams({
            action: 'getDataWE',
            token: userToken,
            filter: filterSponsor,
            startDate: startDate,
            endDate: endDate,
            callback: callbackName
        });
        
        script.src = `${URL_APPS_SCRIPT}?${params.toString()}`;

        script.onerror = () => { alert('Gagal mengambil data dari server.'); showLoading(false); };

        window[callbackName] = (response) => {
            const tableBody = document.getElementById('dataTableBody');
            tableBody.innerHTML = '';
            if (response.status === 'success') {
                response.data.forEach(rowObject => {
                    const tr = document.createElement('tr');
                    const rowData = rowObject.data;
                    const rowIndex = rowObject.rowIndex;

                    const tgl = formatTanggal(rowData[0]);
                    const nama = rowData[1] || '';
                    const hp = rowData[2] || '';
                    const email = rowData[3] || '';
                    const sponsor = rowData[28] || '';
                    const hpSponsor = rowData[29] || '';

                    const safeNama = String(nama).replace(/'/g, "\\'");
                    const safeHp = String(hp).replace(/'/g, "\\'");
                    const safeEmail = String(email).replace(/'/g, "\\'");
                    const safeSponsor = String(sponsor).replace(/'/g, "\\'");
                    const safeHpSponsor = String(hpSponsor).replace(/'/g, "\\'");

                    tr.innerHTML = `
                        <td>${tgl}</td> <td>${nama}</td> <td>${hp}</td> <td>${email}</td>
                        <td>${sponsor}</td> <td>${hpSponsor}</td>
                        <td class="actions-col">
                            <a href="#" class="action-icon" onclick="event.preventDefault(); viewRecord(${rowIndex})" title="Lihat"><i class="fas fa-eye"></i></a>
                            ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); openEditModal(${rowIndex}, '${safeNama}', '${safeHp}', '${safeEmail}', '${safeSponsor}', '${safeHpSponsor}')" title="Edit"><i class="fas fa-edit"></i></a>` : ''}
                            ${userLevel === 'Admin' ? `<a href="#" class="action-icon" onclick="event.preventDefault(); deleteRow(${rowIndex})" title="Hapus"><i class="fas fa-trash"></i></a>` : ''}
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } else {
                alert(response.message);
                if (response.message.includes('Sesi tidak valid')) logout();
            }
            showLoading(false);
            if(window[callbackName]) delete window[callbackName];
            if(script.parentNode) script.parentNode.removeChild(script);
        };
        document.body.appendChild(script);
    }
    
    function logout() {
        showLoading(true);
        const payload = JSON.stringify({ action: "logoutUser", token: userToken });
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: payload
        }).finally(() => {
            sessionStorage.clear();
            window.location.href = 'FormUser.html';
        });
    }

    function openEditModal(rowIndex, nama, hp, email, sponsor, hpSponsor) {
        document.getElementById('editRowIndex').value = rowIndex;
        document.getElementById('editNama').value = nama;
        document.getElementById('editNomorHp').value = hp;
        document.getElementById('editEmail').value = email;
        document.getElementById('editSponsor').value = sponsor;
        document.getElementById('editHpSponsor').value = hpSponsor;
        editModal.show();
    }

    function saveChanges() {
        showLoading(true);
        const payload = {
            action: 'editData',
            token: userToken,
            rowIndex: document.getElementById('editRowIndex').value,
            nama: document.getElementById('editNama').value,
            nomorHp: document.getElementById('editNomorHp').value,
            email: document.getElementById('editEmail').value,
            sponsor: document.getElementById('editSponsor').value,
            hpSponsor: document.getElementById('editHpSponsor').value,
        };
        
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload)
        }).finally(() => {
            editModal.hide();
            setTimeout(loadTableData, 500); // Beri jeda agar server sempat update
        });
    }

    function deleteRow(rowIndex) {
        if (!confirm(`Anda yakin ingin menghapus data baris ke-${rowIndex}? Aksi ini tidak bisa dibatalkan.`)) return;
        showLoading(true);
        const payload = { action: 'deleteData', token: userToken, rowIndex: rowIndex };
        fetch(URL_APPS_SCRIPT, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload)
        }).finally(() => {
            setTimeout(loadTableData, 500);
        });
    }

    function viewRecord(rowIndex) {
        showLoading(true);
        const callbackName = 'view_cb_' + Date.now();
        const script = document.createElement('script');
        script.src = `${URL_APPS_SCRIPT}?action=getSingleRecord&token=${userToken}&rowIndex=${rowIndex}&callback=${callbackName}`;

        window[callbackName] = (response) => {
            if (response.status === 'success') {
                const data = response.data;
                const viewBody = document.getElementById('viewModalBody');

                // Versi Aman: Gunakan "|| []" untuk .map dan "?." untuk objek
                const fungsionalHTML = (data.fungsional || []).map(item => `
                    <tr>
                        <td>${item.label || "-"}</td>
                        <td style="text-align:center;">${item.jawaban || "-"}</td>
                    </tr>`).join('');

                const evaluasiHTML = (data.evaluasi || []).map(item => `
                    <tr>
                        <td>${item.param || "-"}</td>
                        <td class="text-center">${item.hasil || "-"}</td>
                        <td class="text-center">${item.ideal || "-"}</td>
                        <td class="text-center">${item.satuan || "-"}</td>
                        <td style="white-space:pre-line">${item.penjelasan || "-"}</td>
                    </tr>`).join('');

                viewBody.innerHTML = `
                    <!-- DATA PROFILE -->
                    <h6 class="mt-4"><i class="fas fa-user me-2"></i>Data Profile</h6>
                    <table class="table table-bordered">
                        <tr><th style="background-color:#4d94ff;">Tgl Survey</th>
                            <td style="background-color:#4d94ff;"><b>${data.tanggal || "-"}</b></td>
                        </tr>
                        <tr><td>Nama</td><td>${data.nama}</td></tr>
                        <tr><td>No. HP</td><td>${data.hp}</td></tr>
                        <tr><td>Email</td><td>${data.email}</td></tr>
                        <tr><td>Umur</td><td>${data.umur} tahun</td></tr>
                        <tr><td>Jenis Kelamin</td><td>${data.jk}</td></tr>
                        <tr><td>Berat Badan</td><td>${data.berat} kg</td></tr>
                        <tr><td>Tinggi Badan</td><td>${data.tinggi} cm</td></tr>
                        <tr><td>Lingkar Perut</td><td>${data.lingkar} cm</td></tr>
                        <tr><td>Aktivitas Fisik</td><td>${data.aktivitas}</td></tr>
                    </table>

                    <!-- DATA FUNGSIONAL -->
                    <h6 class="mt-4"><i class="fas fa-list-check me-2"></i>Status Fungsional</h6>
                    <table class="table table-bordered">
                        <thead>
                            <tr><th style="background-color:#4d94ff; width:85%;">Pertanyaan</th>
                            <th style="background-color:#4d94ff; text-align:center; width:15%;">Jawaban</th></tr>
                        </thead>
                        <tbody>${fungsionalHTML}</tbody>
                    </table>

                    <!-- DATA EVALUASI -->
                    <h6 class="mt-4"><i class="fas fa-heartbeat me-2"></i>Evaluasi Parameter</h6>
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                               <th style="background-color:#4d94ff; width:25%;">Parameter</th>
                               <th style="background-color:#4d94ff; width:5%; text-align:center;">Hasil</th>
                               <th style="background-color:#4d94ff; width:15%; text-align:center;">Referensi</th>
                               <th style="background-color:#4d94ff; width:5%; text-align:center;">Satuan</th>
                               <th style="background-color:#4d94ff; width:50%;">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>${evaluasiHTML}</tbody>
                    </table>

                    <!-- DATA KESIMPULAN DAN REKOMENDASI -->
                    <h6 class="mt-4">Kesimpulan & Rekomendasi</h6>
                              
                    <table class="table table-bordered">
                    <tbody>
                        <tr><th style="background-color:#4d94ff; width:15%;">Skor</th>
                        <td style="width:85%;">Persentase kebugaran anda : <strong>${data.persen}</strong></td>
                        </tr>
                        <tr><th style="background-color:#4d94ff; width:15%;">Kesimpulan </th>
                        <td style="width:85%;">${data.kesimpulan}</td>
                        </tr>
                        <tr><th style="background-color:#4d94ff; width:15%;">Rekomendasi</th>
                        <td style="width:85%;">${data.rekomendasi}</td>
                        </tr>
                    </tbody>
                    </table>`;
 
                viewModal.show();
            } else {
                alert(response.message);
            }
            showLoading(false);
        };
        document.body.appendChild(script);
    }

    function exportToExcel() {
        const table = document.querySelector(".table-container table");
        let csv = [];
        for (const row of table.rows) {
            let rowData = [];
            // Ambil semua sel kecuali sel terakhir (Aksi)
            for (let i = 0; i < row.cells.length - 1; i++) {
                rowData.push('"' + row.cells[i].innerText.replace(/"/g, '""') + '"');
            }
            csv.push(rowData.join(','));
        }
        const csvContent = "data:text/csv;charset=utf-8," + csv.join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "DataSurvey.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
  
</script>
</body>
</html>
